<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="runtimeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E2E8F0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="contextGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="modelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="toolGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sessionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1E293B">Agent Runtime Architecture</text>
  <text x="450" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#64748B">How AI agents process messages and execute tools</text>

  <!-- Main container -->
  <rect x="50" y="70" width="800" height="410" rx="12" fill="url(#runtimeGradient)" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#475569">Agent Runtime - pi-agent-core</text>
  <line x1="70" y1="115" x2="830" y2="115" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Input Arrow -->
  <text x="90" y="185" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#64748B">User</text>
  <text x="90" y="200" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#64748B">Message</text>
  <line x1="130" y1="190" x2="170" y2="190" stroke="#3B82F6" stroke-width="3"/>
  <polygon points="165,182 185,190 165,198" fill="#3B82F6"/>

  <!-- Context Assembler -->
  <rect x="190" y="140" width="180" height="100" rx="8" fill="url(#contextGradient)" filter="url(#shadow)"/>
  <text x="280" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFF">Context Assembler</text>
  <text x="280" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#BFDBFE">Builds system prompt from:</text>
  <text x="280" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#BFDBFE">AGENTS.md + SOUL.md + USER.md</text>
  <text x="280" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#BFDBFE">+ Session History + Memory</text>

  <!-- Arrow to Model Interface -->
  <line x1="370" y1="190" x2="410" y2="190" stroke="#64748B" stroke-width="2"/>
  <polygon points="405,183 420,190 405,197" fill="#64748B"/>

  <!-- Model Interface -->
  <rect x="425" y="140" width="180" height="100" rx="8" fill="url(#modelGradient)" filter="url(#shadow)"/>
  <text x="515" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFF">Model Interface</text>
  <text x="515" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#DDD6FE">LLM Provider API calls:</text>
  <text x="515" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#DDD6FE">Gemini, Claude, GPT-4</text>
  <text x="515" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#DDD6FE">Streaming + Failover</text>

  <!-- Arrow to Tool Executor -->
  <line x1="605" y1="190" x2="645" y2="190" stroke="#64748B" stroke-width="2"/>
  <polygon points="640,183 655,190 640,197" fill="#64748B"/>

  <!-- Tool Executor -->
  <rect x="660" y="140" width="170" height="100" rx="8" fill="url(#toolGradient)" filter="url(#shadow)"/>
  <text x="745" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFF">Tool Executor</text>
  <text x="745" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#A7F3D0">Executes tool calls:</text>
  <text x="745" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#A7F3D0">read, write, exec</text>
  <text x="745" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#A7F3D0">browser, custom skills</text>

  <!-- Feedback loop arrow from Tool to Model -->
  <path d="M 745 245 L 745 280 L 515 280 L 515 245" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="508,250 515,240 522,250" fill="#64748B"/>
  <text x="630" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#64748B">Tool results loop back for continued reasoning</text>

  <!-- Central merge point to Session Manager -->
  <line x1="280" y1="240" x2="280" y2="310" stroke="#64748B" stroke-width="2"/>
  <line x1="515" y1="280" x2="515" y2="310" stroke="#64748B" stroke-width="2"/>
  <line x1="745" y1="280" x2="745" y2="310" stroke="#64748B" stroke-width="2"/>
  <line x1="280" y1="310" x2="745" y2="310" stroke="#64748B" stroke-width="2"/>
  <line x1="515" y1="310" x2="515" y2="340" stroke="#64748B" stroke-width="2"/>
  <polygon points="508,340 515,355 522,340" fill="#64748B"/>

  <!-- Session Manager -->
  <rect x="340" y="360" width="350" height="100" rx="8" fill="url(#sessionGrad)" filter="url(#shadow)"/>
  <text x="515" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFF">Session Manager</text>
  <text x="515" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FEF3C7">Persists conversation history to disk</text>
  <text x="515" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FEF3C7">Location: ~/.openclaw/agents/[agentId]/sessions/</text>
  <text x="515" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FEF3C7">Handles compaction when context exceeds limits</text>

  <!-- Output Arrow -->
  <line x1="690" y1="410" x2="830" y2="410" stroke="#10B981" stroke-width="3"/>
  <polygon points="825,402 845,410 825,418" fill="#10B981"/>
  <text x="780" y="395" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#10B981">Response</text>
  <text x="780" y="430" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#10B981">to User</text>

</svg>
