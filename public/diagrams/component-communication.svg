<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <defs>
    <linearGradient id="stackGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F1F5F9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E2E8F0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gatewayGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cliGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1E293B">Docker Compose Stack Architecture</text>

  <!-- Main container -->
  <rect x="40" y="60" width="820" height="320" rx="12" fill="url(#stackGradient)" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>

  <!-- Container label -->
  <text x="450" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#475569">Docker Compose Stack</text>
  <line x1="60" y1="105" x2="840" y2="105" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Gateway Service Box -->
  <rect x="70" y="125" width="360" height="230" rx="10" fill="url(#gatewayGradient)" filter="url(#shadow)"/>
  <text x="250" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFF">openclaw-gateway</text>
  <text x="250" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#BFDBFE">Main Service</text>

  <!-- Gateway features -->
  <rect x="90" y="195" width="320" height="140" rx="6" fill="#FFF" opacity="0.15"/>
  <text x="110" y="220" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFF">WebSocket Server</text>
  <text x="110" y="245" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFF">HTTP Control UI</text>
  <text x="110" y="270" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFF">Channel Connectors</text>
  <text x="110" y="295" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFF">Agent Orchestration</text>
  <text x="110" y="320" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFF">Session Management</text>

  <!-- CLI Service Box -->
  <rect x="470" y="125" width="360" height="230" rx="10" fill="url(#cliGradient)" filter="url(#shadow)"/>
  <text x="650" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFF">openclaw-cli</text>
  <text x="650" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#DDD6FE">Utility Container</text>

  <!-- CLI features -->
  <rect x="490" y="195" width="320" height="140" rx="6" fill="#FFF" opacity="0.15"/>
  <text x="510" y="220" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFF">Provider Login</text>
  <text x="510" y="245" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFF">Configuration Management</text>
  <text x="510" y="270" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFF">Health Checks</text>
  <text x="510" y="295" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFF">Diagnostics</text>
  <text x="510" y="320" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFF">CLI Commands</text>

  <!-- Connection arrow between services -->
  <line x1="430" y1="240" x2="470" y2="240" stroke="#64748B" stroke-width="3" stroke-dasharray="8,4"/>
  <polygon points="465,233 480,240 465,247" fill="#64748B"/>

</svg>
