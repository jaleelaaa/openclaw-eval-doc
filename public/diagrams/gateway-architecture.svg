<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="processGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E2E8F0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="serverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="routerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="agentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sessionGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1E293B">Gateway Process Architecture</text>

  <!-- Main Gateway Process Container -->
  <rect x="50" y="55" width="800" height="530" rx="12" fill="url(#processGradient)" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#475569">Gateway Process</text>
  <line x1="70" y1="100" x2="830" y2="100" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Top row: WebSocket, HTTP, Channel Manager -->
  <!-- WebSocket Server -->
  <rect x="90" y="120" width="200" height="100" rx="8" fill="url(#serverGradient)" filter="url(#shadow)"/>
  <text x="190" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFF">WebSocket Server</text>
  <text x="190" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#BFDBFE">Control Plane</text>
  <text x="190" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#BFDBFE">Port 18789</text>

  <!-- HTTP Server -->
  <rect x="350" y="120" width="200" height="100" rx="8" fill="url(#serverGradient)" filter="url(#shadow)"/>
  <text x="450" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFF">HTTP Server</text>
  <text x="450" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#BFDBFE">Control UI</text>
  <text x="450" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#BFDBFE">Dashboard</text>

  <!-- Channel Manager -->
  <rect x="610" y="120" width="200" height="100" rx="8" fill="url(#serverGradient)" filter="url(#shadow)"/>
  <text x="710" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFF">Channel Manager</text>
  <text x="710" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#BFDBFE">Plugins</text>
  <text x="710" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#BFDBFE">Connectors</text>

  <!-- Arrows down to Message Router -->
  <line x1="190" y1="220" x2="190" y2="250" stroke="#64748B" stroke-width="2"/>
  <line x1="190" y1="250" x2="450" y2="250" stroke="#64748B" stroke-width="2"/>
  <line x1="450" y1="220" x2="450" y2="280" stroke="#64748B" stroke-width="2"/>
  <line x1="710" y1="220" x2="710" y2="250" stroke="#64748B" stroke-width="2"/>
  <line x1="710" y1="250" x2="450" y2="250" stroke="#64748B" stroke-width="2"/>
  <polygon points="443,280 450,295 457,280" fill="#64748B"/>

  <!-- Message Router -->
  <rect x="300" y="300" width="300" height="80" rx="8" fill="url(#routerGradient)" filter="url(#shadow)"/>
  <text x="450" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFF">Message Router</text>
  <text x="450" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#DDD6FE">Binding-based Routing</text>

  <!-- Arrow down to Agent Runtime -->
  <line x1="450" y1="380" x2="450" y2="410" stroke="#64748B" stroke-width="2"/>
  <polygon points="443,410 450,425 457,410" fill="#64748B"/>

  <!-- Agent Runtime -->
  <rect x="300" y="430" width="300" height="80" rx="8" fill="url(#agentGradient)" filter="url(#shadow)"/>
  <text x="450" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFF">Agent Runtime</text>
  <text x="450" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#A7F3D0">pi-agent-core</text>

  <!-- Arrow down to Session Manager -->
  <line x1="450" y1="510" x2="450" y2="525" stroke="#64748B" stroke-width="2"/>
  <polygon points="443,525 450,540 457,525" fill="#64748B"/>

  <!-- Session Manager -->
  <rect x="300" y="545" width="300" height="30" rx="6" fill="url(#sessionGradient)" filter="url(#shadow)"/>
  <text x="450" y="566" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFF">Session Manager - File Persistence</text>

</svg>
