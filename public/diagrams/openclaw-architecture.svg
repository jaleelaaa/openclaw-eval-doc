<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <style type="text/css">
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 22px; font-weight: bold; }
      .section-title { font-size: 14px; font-weight: bold; }
      .component-title { font-size: 12px; font-weight: bold; }
      .component-text { font-size: 10px; font-weight: bold; }
      .label { font-size: 11px; font-weight: bold; }
      .step-num { font-size: 12px; font-weight: bold; fill: #333; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c8ebf"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#82b366"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#b85450"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="720" fill="#fafafa"/>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" class="title" fill="#1a1a1a">OpenClaw: Discord-to-Gemini AI Agent Architecture</text>

  <!-- Discord Client Section -->
  <rect x="30" y="60" width="180" height="380" rx="15" fill="#dae8fc" stroke="#6c8ebf" stroke-width="3"/>
  <text x="120" y="90" text-anchor="middle" class="section-title" fill="#1a1a1a">DISCORD CLIENT</text>

  <!-- Discord User Icon -->
  <circle cx="120" cy="140" r="20" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <circle cx="120" cy="130" r="8" fill="#d6b656"/>
  <ellipse cx="120" cy="155" rx="12" ry="8" fill="#d6b656"/>
  <text x="120" y="185" text-anchor="middle" class="component-text" fill="#1a1a1a">Discord User</text>

  <!-- User Message Bubble -->
  <path d="M50,220 L170,220 Q180,220 180,230 L180,270 Q180,280 170,280 L130,280 L120,295 L110,280 L50,280 Q40,280 40,270 L40,230 Q40,220 50,220 Z" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="110" y="255" text-anchor="middle" class="component-text" fill="#1a1a1a">@openclaw hello!</text>

  <!-- Bot Response Bubble -->
  <path d="M50,320 L170,320 Q180,320 180,330 L180,370 Q180,380 170,380 L50,380 Q40,380 40,370 L40,330 Q40,320 50,320 Z" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="110" y="345" text-anchor="middle" class="component-text" fill="#1a1a1a">Hello! How can I</text>
  <text x="110" y="365" text-anchor="middle" class="component-text" fill="#1a1a1a">help you today?</text>

  <!-- Discord Server Icon -->
  <ellipse cx="120" cy="420" rx="50" ry="25" fill="#7289da" stroke="#5865F2" stroke-width="2"/>
  <text x="120" y="425" text-anchor="middle" class="component-text" fill="#ffffff">Discord Server</text>

  <!-- Arrow 1: User to Gateway -->
  <line x1="210" y1="250" x2="270" y2="250" stroke="#b85450" stroke-width="3" marker-end="url(#arrowhead-red)"/>
  <rect x="215" y="220" width="80" height="22" fill="#ffffff" stroke="none"/>
  <text x="255" y="235" text-anchor="middle" class="label" fill="#b85450">1. WebSocket</text>

  <!-- Docker Container -->
  <rect x="280" y="55" width="520" height="410" rx="10" fill="#f5f5f5" stroke="#666666" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="540" y="78" text-anchor="middle" class="section-title" fill="#333333">DOCKER CONTAINER (openclaw-gateway)</text>

  <!-- Discord Monitor -->
  <rect x="300" y="100" width="140" height="75" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="370" y="120" text-anchor="middle" class="component-title" fill="#1a1a1a">DISCORD MONITOR</text>
  <text x="370" y="145" text-anchor="middle" class="component-text" fill="#333">src/discord/monitor/</text>
  <text x="370" y="162" text-anchor="middle" class="component-text" fill="#333">provider.ts</text>

  <!-- Message Router -->
  <rect x="300" y="195" width="140" height="75" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/>
  <text x="370" y="215" text-anchor="middle" class="component-title" fill="#1a1a1a">MESSAGE ROUTER</text>
  <text x="370" y="240" text-anchor="middle" class="component-text" fill="#333">src/routing/</text>
  <text x="370" y="257" text-anchor="middle" class="component-text" fill="#333">session-key.ts</text>

  <!-- Access Control -->
  <rect x="300" y="290" width="140" height="75" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="370" y="310" text-anchor="middle" class="component-title" fill="#1a1a1a">ACCESS CONTROL</text>
  <text x="370" y="335" text-anchor="middle" class="component-text" fill="#333">senders/discord/</text>
  <text x="370" y="352" text-anchor="middle" class="component-text" fill="#333">allowlist.json</text>

  <!-- Agent Engine -->
  <rect x="480" y="100" width="150" height="130" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="555" y="120" text-anchor="middle" class="component-title" fill="#1a1a1a">AGENT ENGINE</text>
  <text x="555" y="145" text-anchor="middle" class="component-text" fill="#333">src/agents/</text>
  <text x="555" y="162" text-anchor="middle" class="component-text" fill="#333">agent-engine.ts</text>
  <line x1="490" y1="175" x2="620" y2="175" stroke="#9673a6" stroke-width="1"/>
  <text x="555" y="193" text-anchor="middle" class="component-text" fill="#333">• System Prompt</text>
  <text x="555" y="208" text-anchor="middle" class="component-text" fill="#333">• Context Manager</text>
  <text x="555" y="223" text-anchor="middle" class="component-text" fill="#333">• Tool Executor</text>

  <!-- Model Router -->
  <rect x="480" y="250" width="150" height="70" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="555" y="273" text-anchor="middle" class="component-title" fill="#1a1a1a">MODEL ROUTER</text>
  <text x="555" y="298" text-anchor="middle" class="component-text" fill="#333">src/models/</text>
  <text x="555" y="313" text-anchor="middle" class="component-text" fill="#333">model-router.ts</text>

  <!-- Response Sender -->
  <rect x="480" y="340" width="150" height="55" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="555" y="363" text-anchor="middle" class="component-title" fill="#1a1a1a">RESPONSE SENDER</text>
  <text x="555" y="385" text-anchor="middle" class="component-text" fill="#333">src/discord/send.ts</text>

  <!-- Config Files Section -->
  <rect x="660" y="100" width="120" height="165" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="720" y="120" text-anchor="middle" class="component-title" fill="#1a1a1a">CONFIG FILES</text>
  <line x1="670" y1="130" x2="770" y2="130" stroke="#d6b656" stroke-width="1"/>
  <text x="720" y="150" text-anchor="middle" class="component-text" fill="#333">openclaw.json</text>
  <text x="720" y="175" text-anchor="middle" class="component-text" fill="#666">• discord.token</text>
  <text x="720" y="192" text-anchor="middle" class="component-text" fill="#666">• groupPolicy</text>
  <text x="720" y="209" text-anchor="middle" class="component-text" fill="#666">• model.primary</text>
  <text x="720" y="232" text-anchor="middle" class="component-text" fill="#333">allowlist.json</text>
  <text x="720" y="252" text-anchor="middle" class="component-text" fill="#333">paired.json</text>

  <!-- Gemini API Section -->
  <rect x="820" y="60" width="200" height="380" rx="15" fill="#d5e8d4" stroke="#82b366" stroke-width="3"/>
  <text x="920" y="90" text-anchor="middle" class="section-title" fill="#1a1a1a">GOOGLE GEMINI API</text>

  <!-- Gemini Icon -->
  <circle cx="920" cy="140" r="30" fill="#4285f4" stroke="#1a73e8" stroke-width="3"/>
  <text x="920" y="150" text-anchor="middle" style="font-size: 28px; font-weight: bold; fill: white;">G</text>

  <!-- API Endpoint -->
  <rect x="840" y="190" width="160" height="55" rx="6" fill="#ffffff" stroke="#82b366" stroke-width="2"/>
  <text x="920" y="210" text-anchor="middle" class="component-text" fill="#1a1a1a">POST /v1/models/</text>
  <text x="920" y="225" text-anchor="middle" class="component-text" fill="#1a1a1a">gemini-3-flash:</text>
  <text x="920" y="240" text-anchor="middle" class="component-text" fill="#1a1a1a">generateContent</text>

  <!-- API Key -->
  <rect x="840" y="260" width="160" height="60" rx="6" fill="#ffffff" stroke="#82b366" stroke-width="2"/>
  <text x="920" y="280" text-anchor="middle" class="component-text" fill="#1a1a1a">Authentication</text>
  <line x1="850" y1="290" x2="990" y2="290" stroke="#82b366" stroke-width="1"/>
  <text x="920" y="308" text-anchor="middle" class="component-text" fill="#333">x-goog-api-key:</text>
  <text x="920" y="323" text-anchor="middle" class="component-text" fill="#333">GEMINI_API_KEY</text>

  <!-- Request Body -->
  <rect x="840" y="335" width="160" height="85" rx="6" fill="#ffffff" stroke="#82b366" stroke-width="2"/>
  <text x="920" y="355" text-anchor="middle" class="component-text" fill="#1a1a1a">Request Body</text>
  <line x1="850" y1="365" x2="990" y2="365" stroke="#82b366" stroke-width="1"/>
  <text x="920" y="383" text-anchor="middle" class="component-text" fill="#333">{</text>
  <text x="920" y="398" text-anchor="middle" class="component-text" fill="#333">contents: [...]</text>
  <text x="920" y="413" text-anchor="middle" class="component-text" fill="#333">systemInstruction</text>

  <!-- Internal Flow Arrows -->
  <!-- Arrow 2 -->
  <line x1="370" y1="175" x2="370" y2="195" stroke="#6c8ebf" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <text x="380" y="188" class="step-num">2</text>

  <!-- Arrow 3 -->
  <line x1="370" y1="270" x2="370" y2="290" stroke="#d79b00" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="380" y="283" class="step-num">3</text>

  <!-- Arrow 4 -->
  <line x1="440" y1="230" x2="480" y2="180" stroke="#9673a6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="450" y="195" class="step-num">4</text>

  <!-- Arrow 5 -->
  <line x1="555" y1="230" x2="555" y2="250" stroke="#82b366" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="565" y="245" class="step-num">5</text>

  <!-- Arrow 6: To Gemini -->
  <line x1="630" y1="285" x2="820" y2="220" stroke="#82b366" stroke-width="3" marker-end="url(#arrowhead-green)"/>
  <rect x="690" y="230" width="70" height="32" fill="#ffffff" stroke="none"/>
  <text x="725" y="245" text-anchor="middle" class="label" fill="#82b366">6. HTTPS</text>
  <text x="725" y="258" text-anchor="middle" class="label" fill="#82b366">API Call</text>

  <!-- Arrow 7: From Gemini -->
  <line x1="820" y1="290" x2="630" y2="340" stroke="#82b366" stroke-width="3" stroke-dasharray="6,3" marker-end="url(#arrowhead-green)"/>
  <rect x="690" y="295" width="70" height="32" fill="#ffffff" stroke="none"/>
  <text x="725" y="310" text-anchor="middle" class="label" fill="#82b366">7. JSON</text>
  <text x="725" y="323" text-anchor="middle" class="label" fill="#82b366">Response</text>

  <!-- Arrow 8: Back to Discord -->
  <line x1="480" y1="367" x2="210" y2="350" stroke="#6c8ebf" stroke-width="3" marker-end="url(#arrowhead-blue)"/>
  <rect x="300" y="340" width="75" height="32" fill="#ffffff" stroke="none"/>
  <text x="337" y="355" text-anchor="middle" class="label" fill="#6c8ebf">8. Discord</text>
  <text x="337" y="368" text-anchor="middle" class="label" fill="#6c8ebf">API</text>

  <!-- Legend -->
  <rect x="30" y="470" width="580" height="100" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="50" y="495" class="component-title" fill="#1a1a1a">LEGEND</text>

  <!-- Legend Items Row 1 -->
  <rect x="50" y="510" width="18" height="12" rx="3" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
  <text x="75" y="520" class="component-text" fill="#1a1a1a">Discord Components</text>

  <rect x="200" y="510" width="18" height="12" rx="3" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
  <text x="225" y="520" class="component-text" fill="#1a1a1a">Agent Engine</text>

  <rect x="330" y="510" width="18" height="12" rx="3" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="355" y="520" class="component-text" fill="#1a1a1a">Gemini/Model Components</text>

  <!-- Legend Items Row 2 -->
  <rect x="50" y="535" width="18" height="12" rx="3" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
  <text x="75" y="545" class="component-text" fill="#1a1a1a">Routing Layer</text>

  <rect x="200" y="535" width="18" height="12" rx="3" fill="#f8cecc" stroke="#b85450" stroke-width="1"/>
  <text x="225" y="545" class="component-text" fill="#1a1a1a">Security/Access Control</text>

  <rect x="380" y="535" width="18" height="12" rx="3" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="405" y="545" class="component-text" fill="#1a1a1a">Configuration Files</text>

  <!-- Footer -->
  <text x="600" y="700" text-anchor="middle" style="font-size: 10px; fill: #666;">OpenClaw v2026.2.1 | Architecture Documentation | Generated: February 2026</text>
</svg>
