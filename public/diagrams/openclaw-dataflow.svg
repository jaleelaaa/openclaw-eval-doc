<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1100" height="650" viewBox="0 0 1100 650">
  <defs>
    <style type="text/css">
      text { font-family: 'Courier New', monospace; }
      .title { font-size: 18px; font-weight: bold; font-family: Arial, sans-serif; }
      .section { font-size: 13px; font-weight: bold; font-family: Arial, sans-serif; }
      .file { font-size: 11px; font-weight: bold; }
      .content { font-size: 10px; font-weight: bold; }
      .arrow-label { font-size: 10px; font-weight: bold; font-family: Arial, sans-serif; }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="650" fill="#fafafa"/>

  <!-- Title -->
  <text x="550" y="30" text-anchor="middle" class="title" fill="#1a1a1a">OpenClaw: Configuration &amp; Data Flow Architecture</text>

  <!-- Configuration Directory Structure -->
  <rect x="30" y="50" width="320" height="370" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="190" y="75" text-anchor="middle" class="section" fill="#1a1a1a">CONFIGURATION DIRECTORY</text>
  <text x="190" y="95" text-anchor="middle" class="content" fill="#666">D:\Openclaw-Test\openclaw-config\</text>

  <!-- openclaw.json -->
  <rect x="50" y="115" width="280" height="140" rx="5" fill="#ffffff" stroke="#d6b656" stroke-width="1"/>
  <text x="60" y="135" class="file" fill="#333">📄 openclaw.json</text>
  <line x1="50" y1="145" x2="330" y2="145" stroke="#d6b656" stroke-width="1"/>
  <text x="60" y="165" class="content" fill="#0066cc">"channels": {</text>
  <text x="70" y="180" class="content" fill="#0066cc">"discord": {</text>
  <text x="80" y="195" class="content" fill="#009900">"token": "MTQ2OD..."</text>
  <text x="80" y="210" class="content" fill="#009900">"groupPolicy": "open"</text>
  <text x="60" y="225" class="content" fill="#0066cc">"agents.defaults.model": {</text>
  <text x="70" y="240" class="content" fill="#009900">"primary": "google/gemini-3-flash"</text>

  <!-- senders directory -->
  <rect x="50" y="265" width="280" height="70" rx="5" fill="#ffffff" stroke="#d6b656" stroke-width="1"/>
  <text x="60" y="285" class="file" fill="#333">📁 senders/discord/</text>
  <line x1="50" y1="295" x2="330" y2="295" stroke="#d6b656" stroke-width="1"/>
  <text x="60" y="315" class="content" fill="#333">📄 allowlist.json</text>
  <text x="180" y="315" class="content" fill="#666">→ Approved user IDs</text>

  <!-- devices directory -->
  <rect x="50" y="345" width="280" height="60" rx="5" fill="#ffffff" stroke="#d6b656" stroke-width="1"/>
  <text x="60" y="365" class="file" fill="#333">📁 devices/</text>
  <line x1="50" y1="375" x2="330" y2="375" stroke="#d6b656" stroke-width="1"/>
  <text x="60" y="393" class="content" fill="#333">📄 paired.json, pending.json</text>

  <!-- Environment Variables -->
  <rect x="30" y="440" width="320" height="120" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="190" y="465" text-anchor="middle" class="section" fill="#1a1a1a">ENVIRONMENT VARIABLES</text>
  <text x="190" y="485" text-anchor="middle" class="content" fill="#666">.env file / Docker environment</text>
  <line x1="50" y1="495" x2="330" y2="495" stroke="#6c8ebf" stroke-width="1"/>
  <text x="60" y="515" class="content" fill="#333">GEMINI_API_KEY=AIzaSyD07...</text>
  <text x="60" y="532" class="content" fill="#333">OPENCLAW_GATEWAY_TOKEN=9cf7b5...</text>
  <text x="60" y="549" class="content" fill="#333">OPENCLAW_CONFIG_DIR=D:/...</text>

  <!-- Source Code Structure -->
  <rect x="390" y="50" width="320" height="350" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="550" y="75" text-anchor="middle" class="section" fill="#1a1a1a">SOURCE CODE MODULES</text>
  <text x="550" y="95" text-anchor="middle" class="content" fill="#666">src/ directory structure</text>

  <!-- Discord module -->
  <rect x="410" y="115" width="280" height="85" rx="5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
  <text x="420" y="135" class="file" fill="#333">📁 src/discord/</text>
  <line x1="410" y1="145" x2="690" y2="145" stroke="#6c8ebf" stroke-width="1"/>
  <text x="420" y="165" class="content" fill="#333">monitor/provider.ts</text>
  <text x="560" y="165" class="content" fill="#666">WebSocket client</text>
  <text x="420" y="182" class="content" fill="#333">send.ts</text>
  <text x="560" y="182" class="content" fill="#666">Send messages</text>

  <!-- Agents module -->
  <rect x="410" y="210" width="280" height="85" rx="5" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
  <text x="420" y="230" class="file" fill="#333">📁 src/agents/</text>
  <line x1="410" y1="240" x2="690" y2="240" stroke="#9673a6" stroke-width="1"/>
  <text x="420" y="260" class="content" fill="#333">agent-engine.ts</text>
  <text x="560" y="260" class="content" fill="#666">Core agent loop</text>
  <text x="420" y="277" class="content" fill="#333">prompts/</text>
  <text x="560" y="277" class="content" fill="#666">System prompts</text>

  <!-- Models module -->
  <rect x="410" y="305" width="280" height="85" rx="5" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="420" y="325" class="file" fill="#333">📁 src/models/</text>
  <line x1="410" y1="335" x2="690" y2="335" stroke="#82b366" stroke-width="1"/>
  <text x="420" y="355" class="content" fill="#333">providers/google.ts</text>
  <text x="585" y="355" class="content" fill="#666">Gemini API</text>
  <text x="420" y="372" class="content" fill="#333">model-router.ts</text>
  <text x="585" y="372" class="content" fill="#666">Route requests</text>

  <!-- External Services -->
  <rect x="750" y="50" width="320" height="200" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="910" y="75" text-anchor="middle" class="section" fill="#1a1a1a">EXTERNAL SERVICES</text>

  <!-- Discord Gateway -->
  <rect x="770" y="95" width="280" height="60" rx="5" fill="#7289da" stroke="#5865F2" stroke-width="2"/>
  <text x="910" y="120" text-anchor="middle" class="file" fill="#ffffff">Discord Gateway</text>
  <text x="910" y="140" text-anchor="middle" class="content" fill="#ffffff">wss://gateway.discord.gg</text>

  <!-- Gemini API -->
  <rect x="770" y="170" width="280" height="60" rx="5" fill="#4285f4" stroke="#1a73e8" stroke-width="2"/>
  <text x="910" y="195" text-anchor="middle" class="file" fill="#ffffff">Google Gemini API</text>
  <text x="910" y="215" text-anchor="middle" class="content" fill="#ffffff">generativelanguage.googleapis.com</text>

  <!-- Data Flow Box -->
  <rect x="750" y="270" width="320" height="290" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="910" y="295" text-anchor="middle" class="section" fill="#1a1a1a">DATA TRANSFORMATION</text>

  <!-- Input -->
  <rect x="770" y="315" width="130" height="70" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1"/>
  <text x="835" y="335" text-anchor="middle" class="file" fill="#333">Input</text>
  <line x1="770" y1="345" x2="900" y2="345" stroke="#b85450" stroke-width="1"/>
  <text x="780" y="365" class="content" fill="#333">"@openclaw hi"</text>
  <text x="780" y="380" class="content" fill="#666">Discord message</text>

  <!-- Processing -->
  <rect x="770" y="400" width="280" height="70" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1"/>
  <text x="910" y="420" text-anchor="middle" class="file" fill="#333">Gemini Request</text>
  <line x1="770" y1="430" x2="1050" y2="430" stroke="#b85450" stroke-width="1"/>
  <text x="780" y="450" class="content" fill="#0066cc">{ contents: [{ parts: [{ text: "hi" }] }],</text>
  <text x="790" y="465" class="content" fill="#0066cc">systemInstruction: "You are..." }</text>

  <!-- Output -->
  <rect x="920" y="315" width="130" height="70" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1"/>
  <text x="985" y="335" text-anchor="middle" class="file" fill="#333">Output</text>
  <line x1="920" y1="345" x2="1050" y2="345" stroke="#b85450" stroke-width="1"/>
  <text x="930" y="365" class="content" fill="#333">"Hello! How can</text>
  <text x="930" y="380" class="content" fill="#333">I help you?"</text>

  <!-- Response -->
  <rect x="770" y="485" width="280" height="55" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1"/>
  <text x="910" y="505" text-anchor="middle" class="file" fill="#333">Gemini Response</text>
  <line x1="770" y1="515" x2="1050" y2="515" stroke="#b85450" stroke-width="1"/>
  <text x="780" y="533" class="content" fill="#0066cc">{ candidates: [{ content: { parts: [...] } }] }</text>

  <!-- Arrows connecting sections -->
  <!-- Config to Source -->
  <line x1="350" y1="200" x2="390" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <text x="360" y="190" class="arrow-label" fill="#555">reads</text>

  <!-- Env to Source -->
  <line x1="350" y1="480" x2="410" y2="350" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <text x="360" y="420" class="arrow-label" fill="#555">injects</text>

  <!-- Source to Discord -->
  <line x1="690" y1="150" x2="770" y2="125" stroke="#5865F2" stroke-width="2" marker-end="url(#arr)"/>
  <text x="720" y="125" class="arrow-label" fill="#5865F2">connect</text>

  <!-- Source to Gemini -->
  <line x1="690" y1="350" x2="770" y2="200" stroke="#4285f4" stroke-width="2" marker-end="url(#arr)"/>
  <text x="720" y="280" class="arrow-label" fill="#4285f4">call</text>

  <!-- Input to Processing -->
  <line x1="835" y1="385" x2="835" y2="400" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Processing to Output -->
  <line x1="910" y1="470" x2="910" y2="485" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="985" y1="400" x2="985" y2="385" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Footer -->
  <text x="550" y="620" text-anchor="middle" style="font-size: 10px; fill: #666; font-family: Arial;">Figure 3: Configuration &amp; Data Flow | OpenClaw v2026.2.1</text>
</svg>
