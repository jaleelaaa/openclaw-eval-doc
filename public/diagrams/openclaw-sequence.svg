<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1100" height="800" viewBox="0 0 1100 800">
  <defs>
    <style type="text/css">
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 20px; font-weight: bold; }
      .actor-name { font-size: 12px; font-weight: bold; }
      .message { font-size: 11px; font-weight: bold; }
      .note { font-size: 10px; font-weight: bold; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="800" fill="#fafafa"/>

  <!-- Title -->
  <text x="550" y="35" text-anchor="middle" class="title" fill="#1a1a1a">OpenClaw: Discord Message Processing Sequence Diagram</text>

  <!-- Actor Boxes -->
  <!-- Discord User -->
  <rect x="60" y="60" width="100" height="40" rx="5" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="110" y="85" text-anchor="middle" class="actor-name" fill="#1a1a1a">Discord User</text>
  <line x1="110" y1="100" x2="110" y2="720" stroke="#d6b656" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Discord API -->
  <rect x="210" y="60" width="100" height="40" rx="5" fill="#7289da" stroke="#5865F2" stroke-width="2"/>
  <text x="260" y="85" text-anchor="middle" class="actor-name" fill="#ffffff">Discord API</text>
  <line x1="260" y1="100" x2="260" y2="720" stroke="#5865F2" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Discord Monitor -->
  <rect x="360" y="60" width="100" height="40" rx="5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="410" y="85" text-anchor="middle" class="actor-name" fill="#1a1a1a">Monitor</text>
  <line x1="410" y1="100" x2="410" y2="720" stroke="#6c8ebf" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Access Control -->
  <rect x="510" y="60" width="100" height="40" rx="5" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="560" y="85" text-anchor="middle" class="actor-name" fill="#1a1a1a">Access Ctrl</text>
  <line x1="560" y1="100" x2="560" y2="720" stroke="#b85450" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Agent Engine -->
  <rect x="660" y="60" width="100" height="40" rx="5" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="710" y="85" text-anchor="middle" class="actor-name" fill="#1a1a1a">Agent</text>
  <line x1="710" y1="100" x2="710" y2="720" stroke="#9673a6" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Model Router -->
  <rect x="810" y="60" width="100" height="40" rx="5" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="860" y="85" text-anchor="middle" class="actor-name" fill="#1a1a1a">Model Router</text>
  <line x1="860" y1="100" x2="860" y2="720" stroke="#82b366" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Gemini API -->
  <rect x="960" y="60" width="100" height="40" rx="5" fill="#4285f4" stroke="#1a73e8" stroke-width="2"/>
  <text x="1010" y="85" text-anchor="middle" class="actor-name" fill="#ffffff">Gemini API</text>
  <line x1="1010" y1="100" x2="1010" y2="720" stroke="#1a73e8" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Step 1: User sends message -->
  <line x1="110" y1="140" x2="250" y2="140" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="130" y="125" width="95" height="18" fill="#ffffff"/>
  <text x="177" y="138" text-anchor="middle" class="message" fill="#333">1. Send message</text>

  <!-- Step 2: WebSocket event -->
  <line x1="260" y1="180" x2="400" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="280" y="165" width="95" height="18" fill="#ffffff"/>
  <text x="327" y="178" text-anchor="middle" class="message" fill="#333">2. WebSocket</text>

  <!-- Activation box for Monitor -->
  <rect x="405" y="175" width="10" height="120" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>

  <!-- Step 3: Validate sender -->
  <line x1="415" y1="220" x2="550" y2="220" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="435" y="205" width="90" height="18" fill="#ffffff"/>
  <text x="480" y="218" text-anchor="middle" class="message" fill="#333">3. Validate</text>

  <!-- Activation box for Access Control -->
  <rect x="555" y="215" width="10" height="50" fill="#f8cecc" stroke="#b85450" stroke-width="1"/>

  <!-- Note: Check allowlist -->
  <rect x="580" y="220" width="100" height="35" rx="3" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="630" y="235" text-anchor="middle" class="note" fill="#333">Check allowlist</text>
  <text x="630" y="248" text-anchor="middle" class="note" fill="#333">Verify pairing</text>

  <!-- Step 4: Return approved -->
  <line x1="550" y1="260" x2="420" y2="260" stroke="#666" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-dashed)"/>
  <rect x="445" y="245" width="85" height="18" fill="#ffffff"/>
  <text x="487" y="258" text-anchor="middle" class="message" fill="#666">4. Approved</text>

  <!-- Step 5: Process message -->
  <line x1="415" y1="300" x2="700" y2="300" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="500" y="285" width="110" height="18" fill="#ffffff"/>
  <text x="555" y="298" text-anchor="middle" class="message" fill="#333">5. Process msg</text>

  <!-- Activation box for Agent -->
  <rect x="705" y="295" width="10" height="200" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>

  <!-- Note: Build prompt -->
  <rect x="720" y="310" width="120" height="50" rx="3" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
  <text x="780" y="328" text-anchor="middle" class="note" fill="#333">Build prompt:</text>
  <text x="780" y="342" text-anchor="middle" class="note" fill="#333">System instruction</text>
  <text x="780" y="356" text-anchor="middle" class="note" fill="#333">User message</text>

  <!-- Step 6: Route to model -->
  <line x1="715" y1="380" x2="850" y2="380" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="745" y="365" width="85" height="18" fill="#ffffff"/>
  <text x="787" y="378" text-anchor="middle" class="message" fill="#333">6. Route</text>

  <!-- Activation box for Model Router -->
  <rect x="855" y="375" width="10" height="120" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>

  <!-- Step 7: API call -->
  <line x1="865" y1="420" x2="1000" y2="420" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="890" y="405" width="85" height="18" fill="#ffffff"/>
  <text x="932" y="418" text-anchor="middle" class="message" fill="#333">7. HTTPS POST</text>

  <!-- Activation box for Gemini -->
  <rect x="1005" y="415" width="10" height="60" fill="#4285f4" stroke="#1a73e8" stroke-width="1"/>

  <!-- Note: Gemini processing -->
  <rect x="1020" y="425" width="65" height="40" rx="3" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="1052" y="443" text-anchor="middle" class="note" fill="#333">Generate</text>
  <text x="1052" y="457" text-anchor="middle" class="note" fill="#333">response</text>

  <!-- Step 8: Return response -->
  <line x1="1000" y1="470" x2="870" y2="470" stroke="#666" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-dashed)"/>
  <rect x="890" y="455" width="85" height="18" fill="#ffffff"/>
  <text x="932" y="468" text-anchor="middle" class="message" fill="#666">8. JSON resp</text>

  <!-- Step 9: Return to agent -->
  <line x1="850" y1="500" x2="720" y2="500" stroke="#666" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-dashed)"/>
  <rect x="755" y="485" width="70" height="18" fill="#ffffff"/>
  <text x="790" y="498" text-anchor="middle" class="message" fill="#666">9. Result</text>

  <!-- Step 10: Format response -->
  <line x1="705" y1="540" x2="420" y2="540" stroke="#666" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-dashed)"/>
  <rect x="510" y="525" width="95" height="18" fill="#ffffff"/>
  <text x="557" y="538" text-anchor="middle" class="message" fill="#666">10. Response</text>

  <!-- Step 11: Send to Discord -->
  <line x1="410" y1="580" x2="270" y2="580" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="290" y="565" width="95" height="18" fill="#ffffff"/>
  <text x="337" y="578" text-anchor="middle" class="message" fill="#333">11. Send reply</text>

  <!-- Step 12: Deliver to user -->
  <line x1="260" y1="620" x2="120" y2="620" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="145" y="605" width="90" height="18" fill="#ffffff"/>
  <text x="190" y="618" text-anchor="middle" class="message" fill="#333">12. Display</text>

  <!-- Timeline markers -->
  <text x="30" y="140" class="note" fill="#666">t₀</text>
  <text x="30" y="300" class="note" fill="#666">t₁</text>
  <text x="30" y="420" class="note" fill="#666">t₂</text>
  <text x="30" y="540" class="note" fill="#666">t₃</text>
  <text x="30" y="620" class="note" fill="#666">t₄</text>

  <!-- Timing annotations -->
  <rect x="30" y="680" width="300" height="60" rx="5" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="40" y="700" class="note" fill="#333">Typical Latency:</text>
  <text x="40" y="715" class="note" fill="#666">Discord WebSocket: ~50ms</text>
  <text x="40" y="730" class="note" fill="#666">Gemini API: 500ms - 2000ms (model dependent)</text>

  <!-- Footer -->
  <text x="550" y="780" text-anchor="middle" style="font-size: 10px; fill: #666;">Figure 2: Message Processing Sequence | OpenClaw v2026.2.1</text>
</svg>
