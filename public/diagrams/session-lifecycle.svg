<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450">
  <defs>
    <linearGradient id="startGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="decisionGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="processGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="endGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="450" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1E293B">Session Lifecycle Flow</text>
  <text x="450" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#64748B">How conversation sessions are created, loaded, and persisted</text>

  <!-- Step 1: User Message Received -->
  <rect x="50" y="90" width="160" height="70" rx="8" fill="url(#startGradient)" filter="url(#shadow)"/>
  <text x="130" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFF">User Message</text>
  <text x="130" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#BFDBFE">Received</text>

  <!-- Arrow 1 -->
  <line x1="210" y1="125" x2="250" y2="125" stroke="#64748B" stroke-width="2"/>
  <polygon points="245,118 260,125 245,132" fill="#64748B"/>

  <!-- Step 2: Session Exists? (Diamond) -->
  <polygon points="340,85 420,125 340,165 260,125" fill="url(#decisionGradient)" filter="url(#shadow)"/>
  <text x="340" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF">Session</text>
  <text x="340" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF">Exists?</text>

  <!-- Arrow: No - Create New -->
  <line x1="420" y1="125" x2="460" y2="125" stroke="#64748B" stroke-width="2"/>
  <text x="440" y="115" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#64748B">No</text>
  <polygon points="455,118 470,125 455,132" fill="#64748B"/>

  <!-- Step 3a: Create New Session -->
  <rect x="475" y="90" width="150" height="70" rx="8" fill="url(#processGrad)" filter="url(#shadow)"/>
  <text x="550" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF">Create New</text>
  <text x="550" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF">Session</text>
  <text x="550" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#DDD6FE">Initialize history file</text>

  <!-- Arrow: Yes - Load Session -->
  <line x1="340" y1="165" x2="340" y2="200" stroke="#64748B" stroke-width="2"/>
  <text x="355" y="185" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#64748B">Yes</text>
  <polygon points="333,195 340,210 347,195" fill="#64748B"/>

  <!-- Step 3b: Load Session History -->
  <rect x="265" y="215" width="150" height="70" rx="8" fill="url(#processGrad)" filter="url(#shadow)"/>
  <text x="340" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF">Load Session</text>
  <text x="340" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF">History</text>
  <text x="340" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#DDD6FE">From JSON file</text>

  <!-- Connect Create New to main flow -->
  <line x1="550" y1="160" x2="550" y2="200" stroke="#64748B" stroke-width="2"/>
  <line x1="550" y1="200" x2="480" y2="200" stroke="#64748B" stroke-width="2"/>
  <line x1="480" y1="200" x2="480" y2="250" stroke="#64748B" stroke-width="2"/>
  <line x1="480" y1="250" x2="420" y2="250" stroke="#64748B" stroke-width="2"/>
  <polygon points="425,243 415,250 425,257" fill="#64748B"/>

  <!-- Arrow from Load to Process -->
  <line x1="340" y1="285" x2="340" y2="310" stroke="#64748B" stroke-width="2"/>
  <polygon points="333,305 340,320 347,305" fill="#64748B"/>

  <!-- Step 4: Process Message -->
  <rect x="265" y="325" width="150" height="70" rx="8" fill="url(#startGradient)" filter="url(#shadow)"/>
  <text x="340" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF">Process Message</text>
  <text x="340" y="367" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#BFDBFE">Agent Execution</text>
  <text x="340" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#BFDBFE">LLM + Tools Loop</text>

  <!-- Arrow to Update Session -->
  <line x1="415" y1="360" x2="475" y2="360" stroke="#64748B" stroke-width="2"/>
  <polygon points="470,353 485,360 470,367" fill="#64748B"/>

  <!-- Step 5: Update Session -->
  <rect x="490" y="325" width="150" height="70" rx="8" fill="url(#processGrad)" filter="url(#shadow)"/>
  <text x="565" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF">Update Session</text>
  <text x="565" y="367" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#DDD6FE">Add messages</text>
  <text x="565" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#DDD6FE">Update metadata</text>

  <!-- Arrow to Persist -->
  <line x1="640" y1="360" x2="700" y2="360" stroke="#64748B" stroke-width="2"/>
  <polygon points="695,353 710,360 695,367" fill="#64748B"/>

  <!-- Step 6: Persist to Disk -->
  <rect x="715" y="325" width="150" height="70" rx="8" fill="url(#endGradient)" filter="url(#shadow)"/>
  <text x="790" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF">Persist to Disk</text>
  <text x="790" y="367" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#A7F3D0">Atomic write</text>
  <text x="790" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#A7F3D0">Backup created</text>

  <!-- Info box -->
  <rect x="640" y="90" width="220" height="130" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <text x="750" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1E293B">Session Key Format</text>
  <line x1="660" y1="125" x2="840" y2="125" stroke="#E2E8F0" stroke-width="1"/>
  <text x="660" y="145" font-family="monospace" font-size="9" font-weight="bold" fill="#6D28D9">agent:[agentId]:[peerId]</text>
  <text x="660" y="165" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#64748B">Example keys:</text>
  <text x="660" y="180" font-family="monospace" font-size="8" font-weight="bold" fill="#475569">agent:default:+1234567890</text>
  <text x="660" y="195" font-family="monospace" font-size="8" font-weight="bold" fill="#475569">agent:coding-bot:@user#1234</text>
  <text x="660" y="210" font-family="monospace" font-size="8" font-weight="bold" fill="#475569">agent:support:U01234567</text>

  <!-- Storage location note -->
  <rect x="50" y="200" width="190" height="80" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <text x="145" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1E293B">Storage Location</text>
  <text x="60" y="250" font-family="monospace" font-size="8" font-weight="bold" fill="#475569">~/.openclaw/agents/</text>
  <text x="60" y="265" font-family="monospace" font-size="8" font-weight="bold" fill="#475569">  [agentId]/sessions/</text>

</svg>
