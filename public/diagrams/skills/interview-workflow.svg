<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="prepGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="interviewGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="evalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="commGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L0,12 L12,6 Z" fill="#4F46E5"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L0,12 L12,6 Z" fill="#22C55E"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L0,12 L12,6 Z" fill="#EF4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#1E293B">
    HR Interview Process Workflow
  </text>
  <text x="500" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#64748B">
    End-to-End Candidate Evaluation Pipeline
  </text>

  <!-- Phase 1: Preparation -->
  <g transform="translate(60, 100)">
    <rect x="0" y="0" width="180" height="160" rx="12" fill="url(#prepGradient)" filter="url(#shadow)"/>
    <circle cx="22" cy="22" r="16" fill="#FFF" opacity="0.95"/>
    <text x="22" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3B82F6">1</text>

    <!-- Icon -->
    <g transform="translate(90, 45)">
      <circle cx="0" cy="0" r="22" fill="#FFF" opacity="0.2"/>
      <rect x="-10" y="-12" width="20" height="24" rx="2" fill="none" stroke="#FFF" stroke-width="2"/>
      <line x1="-6" y1="-4" x2="6" y2="-4" stroke="#FFF" stroke-width="2"/>
      <line x1="-6" y1="2" x2="6" y2="2" stroke="#FFF" stroke-width="2"/>
      <line x1="-6" y1="8" x2="2" y2="8" stroke="#FFF" stroke-width="2"/>
    </g>

    <text x="90" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFF">PREPARATION</text>
    <text x="90" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF" opacity="0.95">• Generate Questions</text>
    <text x="90" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF" opacity="0.95">• Create Rubric</text>
    <text x="90" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF" opacity="0.95">• Schedule Setup</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="250" y1="180" x2="310" y2="180" stroke="#4F46E5" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <!-- Phase 2: Interview -->
  <g transform="translate(330, 100)">
    <rect x="0" y="0" width="180" height="160" rx="12" fill="url(#interviewGradient)" filter="url(#shadow)"/>
    <circle cx="22" cy="22" r="16" fill="#FFF" opacity="0.95"/>
    <text x="22" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8B5CF6">2</text>

    <!-- Icon -->
    <g transform="translate(90, 45)">
      <circle cx="0" cy="0" r="22" fill="#FFF" opacity="0.2"/>
      <circle cx="-10" cy="-4" r="8" fill="none" stroke="#FFF" stroke-width="2"/>
      <circle cx="10" cy="-4" r="8" fill="none" stroke="#FFF" stroke-width="2"/>
      <path d="M-12 12 Q0 20 12 12" fill="none" stroke="#FFF" stroke-width="2"/>
    </g>

    <text x="90" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFF">INTERVIEW</text>
    <text x="90" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF" opacity="0.95">• Conduct Session</text>
    <text x="90" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF" opacity="0.95">• Track Responses</text>
    <text x="90" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF" opacity="0.95">• Real-time Scoring</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <line x1="520" y1="180" x2="580" y2="180" stroke="#4F46E5" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <!-- Phase 3: Evaluation -->
  <g transform="translate(600, 100)">
    <rect x="0" y="0" width="180" height="160" rx="12" fill="url(#evalGradient)" filter="url(#shadow)"/>
    <circle cx="22" cy="22" r="16" fill="#FFF" opacity="0.95"/>
    <text x="22" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#F59E0B">3</text>

    <!-- Icon -->
    <g transform="translate(90, 45)">
      <circle cx="0" cy="0" r="22" fill="#FFF" opacity="0.2"/>
      <path d="M-10 2 L-4 10 L12 -8" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="90" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFF">EVALUATION</text>
    <text x="90" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF" opacity="0.95">• Summarize Notes</text>
    <text x="90" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF" opacity="0.95">• Compare Candidates</text>
    <text x="90" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF" opacity="0.95">• Make Decision</text>
  </g>

  <!-- Arrow 3 down to 4 -->
  <path d="M 690 270 L 690 310 L 690 340 L 540 340 L 540 370" fill="none" stroke="#4F46E5" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <!-- Phase 4: Communication -->
  <g transform="translate(450, 390)">
    <rect x="0" y="0" width="180" height="160" rx="12" fill="url(#commGradient)" filter="url(#shadow)"/>
    <circle cx="22" cy="22" r="16" fill="#FFF" opacity="0.95"/>
    <text x="22" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#10B981">4</text>

    <!-- Icon -->
    <g transform="translate(90, 45)">
      <circle cx="0" cy="0" r="22" fill="#FFF" opacity="0.2"/>
      <rect x="-12" y="-8" width="24" height="16" rx="2" fill="none" stroke="#FFF" stroke-width="2"/>
      <path d="M-12 -6 L0 2 L12 -6" fill="none" stroke="#FFF" stroke-width="2"/>
    </g>

    <text x="90" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFF">COMMUNICATION</text>
    <text x="90" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF" opacity="0.95">• Draft Offer Letter</text>
    <text x="90" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF" opacity="0.95">• Send Rejection</text>
    <text x="90" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF" opacity="0.95">• Follow-up Actions</text>
  </g>

  <!-- Arrow to Offer -->
  <line x1="450" y1="470" x2="330" y2="470" stroke="#22C55E" stroke-width="4" marker-end="url(#arrowGreen)"/>

  <!-- Offer box -->
  <g transform="translate(150, 435)">
    <rect x="0" y="0" width="160" height="70" rx="10" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" filter="url(#shadow)"/>
    <text x="80" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#166534">OFFER</text>
    <text x="80" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#166534">Proceed to Onboarding</text>
  </g>

  <!-- Arrow to Rejection -->
  <line x1="630" y1="470" x2="750" y2="470" stroke="#EF4444" stroke-width="4" marker-end="url(#arrowRed)"/>

  <!-- Rejection box -->
  <g transform="translate(770, 435)">
    <rect x="0" y="0" width="160" height="70" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="3" filter="url(#shadow)"/>
    <text x="80" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#991B1B">REJECTION</text>
    <text x="80" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#991B1B">Talent Pool / Archive</text>
  </g>

  <!-- Key metrics panel - moved to bottom left -->
  <g transform="translate(60, 530)">
    <rect x="0" y="0" width="280" height="130" rx="10" fill="#FFF" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)"/>
    <text x="140" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E293B">Key Metrics Tracked</text>
    <line x1="20" y1="38" x2="260" y2="38" stroke="#E2E8F0" stroke-width="1"/>

    <g transform="translate(25, 52)">
      <circle cx="8" cy="8" r="8" fill="#3B82F6"/>
      <text x="24" y="12" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">Technical Skills Score</text>
    </g>
    <g transform="translate(25, 74)">
      <circle cx="8" cy="8" r="8" fill="#8B5CF6"/>
      <text x="24" y="12" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">Communication Rating</text>
    </g>
    <g transform="translate(25, 96)">
      <circle cx="8" cy="8" r="8" fill="#F59E0B"/>
      <text x="24" y="12" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">Problem Solving Ability</text>
    </g>
    <g transform="translate(25, 118)">
      <circle cx="8" cy="8" r="8" fill="#10B981"/>
      <text x="24" y="12" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">Cultural Fit Assessment</text>
    </g>
  </g>

  <!-- Timeline panel - moved to bottom right -->
  <g transform="translate(380, 530)">
    <rect x="0" y="0" width="560" height="130" rx="10" fill="#FFF" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)"/>
    <text x="280" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E293B">Typical Interview Cycle Timeline</text>
    <line x1="20" y1="38" x2="540" y2="38" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Timeline line -->
    <line x1="50" y1="80" x2="510" y2="80" stroke="#CBD5E1" stroke-width="3"/>

    <!-- Timeline points -->
    <circle cx="80" cy="80" r="10" fill="#3B82F6"/>
    <text x="80" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#3B82F6">Day 1-2</text>
    <text x="80" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#64748B">Preparation</text>

    <circle cx="210" cy="80" r="10" fill="#8B5CF6"/>
    <text x="210" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#8B5CF6">Day 3-5</text>
    <text x="210" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#64748B">Interview</text>

    <circle cx="360" cy="80" r="10" fill="#F59E0B"/>
    <text x="360" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#F59E0B">Day 6-7</text>
    <text x="360" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#64748B">Evaluation</text>

    <circle cx="490" cy="80" r="10" fill="#10B981"/>
    <text x="490" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#10B981">Day 8-10</text>
    <text x="490" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#64748B">Communication</text>
  </g>

</svg>
