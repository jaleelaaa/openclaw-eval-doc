<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="prepGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="interviewGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="evalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="commGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366F1"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1E293B">
    HR Interview Process Workflow
  </text>
  <text x="450" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748B">
    End-to-End Candidate Evaluation Pipeline
  </text>

  <!-- Phase 1: Preparation -->
  <g transform="translate(50, 100)">
    <!-- Main box -->
    <rect x="0" y="0" width="180" height="180" rx="12" fill="url(#prepGradient)" filter="url(#shadow)"/>

    <!-- Phase number badge -->
    <circle cx="20" cy="20" r="16" fill="#FFF" opacity="0.9"/>
    <text x="20" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3B82F6">1</text>

    <!-- Icon -->
    <g transform="translate(90, 50)">
      <circle cx="0" cy="0" r="25" fill="#FFF" opacity="0.2"/>
      <path d="M-12 -8 L12 -8 L12 12 L-12 12 Z M-8 -12 L8 -12 L8 -8 L-8 -8 Z" fill="#FFF" stroke="#FFF" stroke-width="1.5"/>
      <line x1="-6" y1="-2" x2="6" y2="-2" stroke="#3B82F6" stroke-width="2"/>
      <line x1="-6" y1="4" x2="6" y2="4" stroke="#3B82F6" stroke-width="2"/>
    </g>

    <!-- Title -->
    <text x="90" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFF">
      PREPARATION
    </text>

    <!-- Items -->
    <text x="90" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF" opacity="0.95">
      • Generate Questions
    </text>
    <text x="90" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF" opacity="0.95">
      • Create Rubric
    </text>
    <text x="90" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF" opacity="0.95">
      • Schedule Setup
    </text>
  </g>

  <!-- Arrow 1 to 2 -->
  <g>
    <line x1="240" y1="190" x2="295" y2="190" stroke="url(#arrowGradient)" stroke-width="3" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Phase 2: Interview -->
  <g transform="translate(310, 100)">
    <!-- Main box -->
    <rect x="0" y="0" width="180" height="180" rx="12" fill="url(#interviewGradient)" filter="url(#shadow)"/>

    <!-- Phase number badge -->
    <circle cx="20" cy="20" r="16" fill="#FFF" opacity="0.9"/>
    <text x="20" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8B5CF6">2</text>

    <!-- Icon -->
    <g transform="translate(90, 50)">
      <circle cx="0" cy="0" r="25" fill="#FFF" opacity="0.2"/>
      <circle cx="-8" cy="-5" r="8" fill="none" stroke="#FFF" stroke-width="2"/>
      <circle cx="8" cy="-5" r="8" fill="none" stroke="#FFF" stroke-width="2"/>
      <path d="M-12 10 Q0 18 12 10" fill="none" stroke="#FFF" stroke-width="2"/>
    </g>

    <!-- Title -->
    <text x="90" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFF">
      INTERVIEW
    </text>

    <!-- Items -->
    <text x="90" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF" opacity="0.95">
      • Conduct Session
    </text>
    <text x="90" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF" opacity="0.95">
      • Track Responses
    </text>
    <text x="90" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF" opacity="0.95">
      • Real-time Scoring
    </text>
  </g>

  <!-- Arrow 2 to 3 -->
  <g>
    <line x1="500" y1="190" x2="555" y2="190" stroke="url(#arrowGradient)" stroke-width="3" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Phase 3: Evaluation -->
  <g transform="translate(570, 100)">
    <!-- Main box -->
    <rect x="0" y="0" width="180" height="180" rx="12" fill="url(#evalGradient)" filter="url(#shadow)"/>

    <!-- Phase number badge -->
    <circle cx="20" cy="20" r="16" fill="#FFF" opacity="0.9"/>
    <text x="20" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#F59E0B">3</text>

    <!-- Icon -->
    <g transform="translate(90, 50)">
      <circle cx="0" cy="0" r="25" fill="#FFF" opacity="0.2"/>
      <path d="M-10 5 L-3 12 L12 -8" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Title -->
    <text x="90" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFF">
      EVALUATION
    </text>

    <!-- Items -->
    <text x="90" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF" opacity="0.95">
      • Summarize Notes
    </text>
    <text x="90" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF" opacity="0.95">
      • Compare Candidates
    </text>
    <text x="90" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF" opacity="0.95">
      • Make Decision
    </text>
  </g>

  <!-- Arrow 3 to 4 (curved down) -->
  <g>
    <path d="M 660 290 L 660 340 Q 660 360 640 360 L 460 360" fill="none" stroke="url(#arrowGradient)" stroke-width="3"/>
    <polygon points="460,356 450,360 460,364" fill="#6366F1"/>
  </g>

  <!-- Phase 4: Communication -->
  <g transform="translate(260, 320)">
    <!-- Main box - wider -->
    <rect x="0" y="0" width="180" height="180" rx="12" fill="url(#commGradient)" filter="url(#shadow)"/>

    <!-- Phase number badge -->
    <circle cx="20" cy="20" r="16" fill="#FFF" opacity="0.9"/>
    <text x="20" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#10B981">4</text>

    <!-- Icon -->
    <g transform="translate(90, 50)">
      <circle cx="0" cy="0" r="25" fill="#FFF" opacity="0.2"/>
      <rect x="-12" y="-8" width="24" height="16" rx="2" fill="none" stroke="#FFF" stroke-width="2"/>
      <path d="M-12 -6 L0 2 L12 -6" fill="none" stroke="#FFF" stroke-width="2"/>
    </g>

    <!-- Title -->
    <text x="90" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFF">
      COMMUNICATION
    </text>

    <!-- Items -->
    <text x="90" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF" opacity="0.95">
      • Draft Offer Letter
    </text>
    <text x="90" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF" opacity="0.95">
      • Send Rejection
    </text>
    <text x="90" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF" opacity="0.95">
      • Follow-up Actions
    </text>
  </g>

  <!-- Output boxes -->
  <!-- Offer path -->
  <g transform="translate(50, 380)">
    <rect x="0" y="0" width="150" height="60" rx="8" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/>
    <text x="75" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">OFFER</text>
    <text x="75" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#166534">Proceed to Onboarding</text>
  </g>
  <path d="M 260 410 L 210 410" fill="none" stroke="#22C55E" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Rejection path -->
  <g transform="translate(500, 380)">
    <rect x="0" y="0" width="150" height="60" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
    <text x="75" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#991B1B">REJECTION</text>
    <text x="75" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#991B1B">Talent Pool / Archive</text>
  </g>
  <path d="M 440 410 L 490 410" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Key metrics panel -->
  <g transform="translate(570, 340)">
    <rect x="0" y="0" width="280" height="140" rx="10" fill="#FFF" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)"/>
    <text x="140" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E293B">Key Metrics Tracked</text>
    <line x1="20" y1="35" x2="260" y2="35" stroke="#E2E8F0" stroke-width="1"/>

    <g transform="translate(20, 50)">
      <circle cx="8" cy="8" r="6" fill="#3B82F6"/>
      <text x="22" y="12" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#475569">Technical Skills Score</text>
    </g>
    <g transform="translate(20, 72)">
      <circle cx="8" cy="8" r="6" fill="#8B5CF6"/>
      <text x="22" y="12" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#475569">Communication Rating</text>
    </g>
    <g transform="translate(20, 94)">
      <circle cx="8" cy="8" r="6" fill="#F59E0B"/>
      <text x="22" y="12" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#475569">Problem Solving Ability</text>
    </g>
    <g transform="translate(20, 116)">
      <circle cx="8" cy="8" r="6" fill="#10B981"/>
      <text x="22" y="12" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#475569">Cultural Fit Assessment</text>
    </g>
  </g>

  <!-- Timeline indicator -->
  <g transform="translate(50, 530)">
    <line x1="0" y1="0" x2="700" y2="0" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="100" cy="0" r="6" fill="#3B82F6"/>
    <circle cx="300" cy="0" r="6" fill="#8B5CF6"/>
    <circle cx="500" cy="0" r="6" fill="#F59E0B"/>
    <circle cx="700" cy="0" r="6" fill="#10B981"/>

    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#64748B">Day 1-2</text>
    <text x="300" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#64748B">Day 3-5</text>
    <text x="500" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#64748B">Day 6-7</text>
    <text x="700" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#64748B">Day 8-10</text>

    <text x="350" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#94A3B8">Typical Interview Cycle Timeline</text>
  </g>

</svg>
