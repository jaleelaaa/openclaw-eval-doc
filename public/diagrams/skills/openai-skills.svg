<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      .label { font: bold 13px Arial, sans-serif; fill: #ffffff; }
      .small-text { font: bold 11px Arial, sans-serif; fill: #4b5563; }
      .code { font: bold 11px Consolas, monospace; fill: #1f2937; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a1a2e"/>
    </marker>
    <linearGradient id="openaiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10a37f"/>
      <stop offset="100%" style="stop-color:#1a7f5a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="url(#openaiGrad)"/>
  <text x="400" y="35" text-anchor="middle" style="font: bold 24px Arial; fill: white;">🤖 OPENAI SKILLS</text>
  <text x="400" y="52" text-anchor="middle" style="font: bold 12px Arial; fill: #a7f3d0;">Whisper API &amp; Image Generation (DALL-E)</text>

  <!-- Whisper Section -->
  <rect x="20" y="75" width="370" height="230" fill="#f0fdf4" stroke="#10b981" stroke-width="2" rx="8"/>
  <text x="205" y="100" text-anchor="middle" style="font: bold 18px Arial; fill: #059669;">🎤 WHISPER API</text>
  <text x="40" y="125" style="font: bold 14px Arial; fill: #1a1a2e;">Purpose: Speech-to-Text</text>
  <text x="40" y="150" class="small-text">Transcribe audio files (mp3, wav, etc.)</text>
  <text x="40" y="170" class="small-text">Meeting recordings</text>
  <text x="40" y="190" class="small-text">Voice memos</text>
  <text x="40" y="210" class="small-text">Podcast transcription</text>

  <!-- Whisper Flow -->
  <rect x="40" y="225" width="60" height="40" fill="#8b5cf6" rx="4"/>
  <text x="70" y="250" text-anchor="middle" style="font: bold 10px Arial; fill: white;">Audio</text>
  <line x1="100" y1="245" x2="130" y2="245" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="140" y="225" width="80" height="40" fill="#3b82f6" rx="4"/>
  <text x="180" y="250" text-anchor="middle" style="font: bold 10px Arial; fill: white;">OpenClaw</text>
  <line x1="220" y1="245" x2="250" y2="245" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="260" y="225" width="80" height="40" fill="#10a37f" rx="4"/>
  <text x="300" y="250" text-anchor="middle" style="font: bold 10px Arial; fill: white;">Whisper</text>
  <line x1="300" y1="265" x2="300" y2="290" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="305" text-anchor="middle" style="font: bold 11px Arial; fill: #059669;">📄 Text Output</text>

  <!-- Image Gen Section -->
  <rect x="410" y="75" width="370" height="230" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <text x="595" y="100" text-anchor="middle" style="font: bold 18px Arial; fill: #d97706;">🎨 IMAGE GENERATION</text>
  <text x="430" y="125" style="font: bold 14px Arial; fill: #1a1a2e;">Purpose: DALL-E Images</text>
  <text x="430" y="150" class="small-text">Generate images from text prompts</text>
  <text x="430" y="170" class="small-text">Create variations</text>
  <text x="430" y="190" class="small-text">Batch generation</text>
  <text x="430" y="210" class="small-text">Random prompt sampling</text>

  <!-- Image Gen Flow -->
  <rect x="430" y="225" width="60" height="40" fill="#8b5cf6" rx="4"/>
  <text x="460" y="250" text-anchor="middle" style="font: bold 10px Arial; fill: white;">Prompt</text>
  <line x1="490" y1="245" x2="520" y2="245" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="530" y="225" width="80" height="40" fill="#3b82f6" rx="4"/>
  <text x="570" y="250" text-anchor="middle" style="font: bold 10px Arial; fill: white;">OpenClaw</text>
  <line x1="610" y1="245" x2="640" y2="245" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="650" y="225" width="80" height="40" fill="#f59e0b" rx="4"/>
  <text x="690" y="250" text-anchor="middle" style="font: bold 10px Arial; fill: white;">DALL-E</text>
  <line x1="690" y1="265" x2="690" y2="290" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="690" y="305" text-anchor="middle" style="font: bold 11px Arial; fill: #d97706;">🖼️ Image URL</text>

  <!-- Requirements -->
  <rect x="20" y="320" width="760" height="80" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="8"/>
  <text x="40" y="345" style="font: bold 16px Arial; fill: #dc2626;">⚠️ REQUIREMENTS (Both Skills)</text>
  <text x="40" y="370" class="code">Missing: env:OPENAI_API_KEY</text>
  <text x="40" y="390" class="small-text">Get your API key from: platform.openai.com/api-keys - Add to Skills page or .env file</text>

  <!-- Examples -->
  <rect x="20" y="415" width="370" height="170" fill="#ecfdf5" stroke="#10b981" stroke-width="2" rx="8"/>
  <text x="40" y="440" style="font: bold 14px Arial; fill: #059669;">WHISPER EXAMPLES</text>
  <text x="40" y="465" class="code">@openclaw transcribe this audio</text>
  <text x="40" y="485" class="small-text">[attach audio file in Discord]</text>
  <text x="40" y="515" class="code">@openclaw convert this</text>
  <text x="40" y="535" class="code">recording to text</text>
  <text x="40" y="565" class="small-text">Supports: mp3, wav, m4a, webm, mp4</text>

  <rect x="410" y="415" width="370" height="170" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <text x="430" y="440" style="font: bold 14px Arial; fill: #d97706;">IMAGE GEN EXAMPLES</text>
  <text x="430" y="465" class="code">@openclaw generate an image</text>
  <text x="430" y="485" class="code">of a futuristic city</text>
  <text x="430" y="515" class="code">@openclaw create 4 variations</text>
  <text x="430" y="535" class="code">of a cute robot mascot</text>
  <text x="430" y="565" class="small-text">Returns: Image URL(s)</text>
</svg>
