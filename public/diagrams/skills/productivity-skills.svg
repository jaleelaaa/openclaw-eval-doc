<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <style>
      .title { font: bold 22px Arial, sans-serif; fill: #1a1a2e; }
      .label { font: bold 13px Arial, sans-serif; fill: #ffffff; }
      .small-text { font: bold 11px Arial, sans-serif; fill: #4b5563; }
      .code { font: bold 11px Consolas, monospace; fill: #1f2937; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a1a2e"/>
    </marker>
    <linearGradient id="prodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#ffffff"/>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="70" fill="url(#prodGrad)"/>
  <text x="600" y="40" text-anchor="middle" style="font: bold 28px Arial; fill: white;">PRODUCTIVITY SKILLS</text>
  <text x="600" y="60" text-anchor="middle" style="font: bold 14px Arial; fill: #c4b5fd;">Trello, Obsidian, Bear Notes, Things, Apple Notes, Apple Reminders</text>

  <!-- TRELLO SKILL -->
  <rect x="20" y="85" width="380" height="250" fill="#f0f9ff" stroke="#0079bf" stroke-width="3" rx="10"/>
  <rect x="20" y="85" width="380" height="40" fill="#0079bf" rx="10"/>
  <rect x="20" y="105" width="380" height="20" fill="#0079bf"/>
  <text x="210" y="112" text-anchor="middle" style="font: bold 18px Arial; fill: white;">TRELLO</text>

  <text x="40" y="150" style="font: bold 14px Arial; fill: #1a1a2e;">Purpose: Kanban Board Management</text>
  <text x="40" y="175" class="small-text">* Create/move cards between lists</text>
  <text x="40" y="195" class="small-text">* Manage boards and members</text>
  <text x="40" y="215" class="small-text">* Add labels, due dates, checklists</text>

  <rect x="40" y="235" width="340" height="40" fill="#fef2f2" stroke="#dc2626" rx="5"/>
  <text x="60" y="260" class="code">Missing: env:TRELLO_API_KEY</text>

  <text x="40" y="300" class="code">@openclaw move "Task" to Done</text>
  <text x="40" y="320" class="code">@openclaw create card "New Feature"</text>

  <!-- OBSIDIAN SKILL -->
  <rect x="410" y="85" width="380" height="250" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3" rx="10"/>
  <rect x="410" y="85" width="380" height="40" fill="#7c3aed" rx="10"/>
  <rect x="410" y="105" width="380" height="20" fill="#7c3aed"/>
  <text x="600" y="112" text-anchor="middle" style="font: bold 18px Arial; fill: white;">OBSIDIAN</text>

  <text x="430" y="150" style="font: bold 14px Arial; fill: #1a1a2e;">Purpose: Knowledge Base Notes</text>
  <text x="430" y="175" class="small-text">* Create/edit markdown notes</text>
  <text x="430" y="195" class="small-text">* Link notes with [[wikilinks]]</text>
  <text x="430" y="215" class="small-text">* Search across vault</text>

  <rect x="430" y="235" width="340" height="40" fill="#fef2f2" stroke="#dc2626" rx="5"/>
  <text x="450" y="260" class="code">Missing: env:OBSIDIAN_VAULT_PATH</text>

  <text x="430" y="300" class="code">@openclaw create note "Daily Log"</text>
  <text x="430" y="320" class="code">@openclaw search vault "project"</text>

  <!-- BEAR NOTES SKILL -->
  <rect x="800" y="85" width="380" height="250" fill="#fef3c7" stroke="#d97706" stroke-width="3" rx="10"/>
  <rect x="800" y="85" width="380" height="40" fill="#d97706" rx="10"/>
  <rect x="800" y="105" width="380" height="20" fill="#d97706"/>
  <text x="990" y="112" text-anchor="middle" style="font: bold 18px Arial; fill: white;">BEAR NOTES (macOS)</text>

  <text x="820" y="150" style="font: bold 14px Arial; fill: #1a1a2e;">Purpose: Beautiful Note Taking</text>
  <text x="820" y="175" class="small-text">* Create/edit notes with tags</text>
  <text x="820" y="195" class="small-text">* Markdown formatting support</text>
  <text x="820" y="215" class="small-text">* Export to various formats</text>

  <rect x="820" y="235" width="340" height="40" fill="#ecfdf5" stroke="#10b981" rx="5"/>
  <text x="840" y="260" style="font: bold 11px Arial; fill: #059669;">Status: READY (macOS only)</text>

  <text x="820" y="300" class="code">@openclaw create bear note "Ideas"</text>
  <text x="820" y="320" class="code">@openclaw search bear #work</text>

  <!-- THINGS (macOS) SKILL -->
  <rect x="20" y="350" width="380" height="250" fill="#ecfdf5" stroke="#10b981" stroke-width="3" rx="10"/>
  <rect x="20" y="350" width="380" height="40" fill="#10b981" rx="10"/>
  <rect x="20" y="370" width="380" height="20" fill="#10b981"/>
  <text x="210" y="377" text-anchor="middle" style="font: bold 18px Arial; fill: white;">THINGS 3 (macOS)</text>

  <text x="40" y="415" style="font: bold 14px Arial; fill: #1a1a2e;">Purpose: Task Management</text>
  <text x="40" y="440" class="small-text">* Create todos with due dates</text>
  <text x="40" y="460" class="small-text">* Organize into projects/areas</text>
  <text x="40" y="480" class="small-text">* Add tags and checklists</text>

  <rect x="40" y="500" width="340" height="40" fill="#ecfdf5" stroke="#10b981" rx="5"/>
  <text x="60" y="525" style="font: bold 11px Arial; fill: #059669;">Status: READY (macOS + Things 3)</text>

  <text x="40" y="565" class="code">@openclaw add task "Buy groceries"</text>
  <text x="40" y="585" class="code">@openclaw show today's tasks</text>

  <!-- APPLE NOTES SKILL -->
  <rect x="410" y="350" width="380" height="250" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" rx="10"/>
  <rect x="410" y="350" width="380" height="40" fill="#f59e0b" rx="10"/>
  <rect x="410" y="370" width="380" height="20" fill="#f59e0b"/>
  <text x="600" y="377" text-anchor="middle" style="font: bold 18px Arial; fill: white;">APPLE NOTES (macOS)</text>

  <text x="430" y="415" style="font: bold 14px Arial; fill: #1a1a2e;">Purpose: Native Notes App</text>
  <text x="430" y="440" class="small-text">* Create/edit notes in folders</text>
  <text x="430" y="460" class="small-text">* Rich text formatting</text>
  <text x="430" y="480" class="small-text">* iCloud sync support</text>

  <rect x="430" y="500" width="340" height="40" fill="#ecfdf5" stroke="#10b981" rx="5"/>
  <text x="450" y="525" style="font: bold 11px Arial; fill: #059669;">Status: READY (macOS only)</text>

  <text x="430" y="565" class="code">@openclaw create apple note "Shopping"</text>
  <text x="430" y="585" class="code">@openclaw list notes in Work folder</text>

  <!-- APPLE REMINDERS SKILL -->
  <rect x="800" y="350" width="380" height="250" fill="#fce7f3" stroke="#ec4899" stroke-width="3" rx="10"/>
  <rect x="800" y="350" width="380" height="40" fill="#ec4899" rx="10"/>
  <rect x="800" y="370" width="380" height="20" fill="#ec4899"/>
  <text x="990" y="377" text-anchor="middle" style="font: bold 18px Arial; fill: white;">APPLE REMINDERS (macOS)</text>

  <text x="820" y="415" style="font: bold 14px Arial; fill: #1a1a2e;">Purpose: Native Reminders App</text>
  <text x="820" y="440" class="small-text">* Create reminders with due dates</text>
  <text x="820" y="460" class="small-text">* Location-based reminders</text>
  <text x="820" y="480" class="small-text">* Organize in lists</text>

  <rect x="820" y="500" width="340" height="40" fill="#ecfdf5" stroke="#10b981" rx="5"/>
  <text x="840" y="525" style="font: bold 11px Arial; fill: #059669;">Status: READY (macOS only)</text>

  <text x="820" y="565" class="code">@openclaw remind me to call at 5pm</text>
  <text x="820" y="585" class="code">@openclaw show my reminders</text>

  <!-- Architecture Diagram -->
  <rect x="20" y="620" width="1160" height="260" fill="#f8fafc" stroke="#64748b" stroke-width="2" rx="10"/>
  <text x="600" y="650" text-anchor="middle" style="font: bold 20px Arial; fill: #1e293b;">PRODUCTIVITY SKILLS ARCHITECTURE</text>

  <!-- User -->
  <rect x="60" y="680" width="100" height="60" fill="#8b5cf6" rx="8"/>
  <text x="110" y="715" text-anchor="middle" class="label">USER</text>

  <!-- Arrow -->
  <line x1="160" y1="710" x2="220" y2="710" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="190" y="700" style="font: bold 9px Arial; fill: #6b7280;">Request</text>

  <!-- Gateway -->
  <rect x="230" y="680" width="120" height="60" fill="#3b82f6" rx="8"/>
  <text x="290" y="705" text-anchor="middle" class="label">OPENCLAW</text>
  <text x="290" y="722" text-anchor="middle" class="label">GATEWAY</text>

  <!-- Arrows to services -->
  <line x1="350" y1="690" x2="420" y2="690" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="710" x2="420" y2="750" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="730" x2="420" y2="810" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cloud Services -->
  <rect x="430" y="670" width="150" height="45" fill="#0079bf" rx="6"/>
  <text x="505" y="698" text-anchor="middle" class="label">TRELLO API</text>

  <rect x="430" y="730" width="150" height="45" fill="#7c3aed" rx="6"/>
  <text x="505" y="758" text-anchor="middle" class="label">OBSIDIAN LOCAL</text>

  <rect x="430" y="790" width="150" height="45" fill="#1a1a2e" rx="6"/>
  <text x="505" y="818" text-anchor="middle" class="label">NOTION API</text>

  <!-- macOS Services -->
  <rect x="620" y="670" width="180" height="170" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" rx="8"/>
  <text x="710" y="695" text-anchor="middle" style="font: bold 14px Arial; fill: #1a1a2e;">macOS NATIVE</text>

  <rect x="635" y="710" width="70" height="35" fill="#d97706" rx="4"/>
  <text x="670" y="732" text-anchor="middle" style="font: bold 9px Arial; fill: white;">Bear</text>

  <rect x="715" y="710" width="70" height="35" fill="#10b981" rx="4"/>
  <text x="750" y="732" text-anchor="middle" style="font: bold 9px Arial; fill: white;">Things</text>

  <rect x="635" y="755" width="70" height="35" fill="#f59e0b" rx="4"/>
  <text x="670" y="777" text-anchor="middle" style="font: bold 9px Arial; fill: white;">Notes</text>

  <rect x="715" y="755" width="70" height="35" fill="#ec4899" rx="4"/>
  <text x="750" y="777" text-anchor="middle" style="font: bold 9px Arial; fill: white;">Reminders</text>

  <!-- Arrow from gateway to macOS -->
  <line x1="350" y1="720" x2="620" y2="750" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="720" style="font: bold 9px Arial; fill: #6b7280;">AppleScript</text>

  <!-- Results -->
  <rect x="850" y="700" width="300" height="110" fill="#ffffff" stroke="#10b981" stroke-width="2" rx="8"/>
  <text x="1000" y="725" text-anchor="middle" style="font: bold 14px Arial; fill: #059669;">RESULTS</text>
  <text x="870" y="750" class="small-text">* Tasks created/updated</text>
  <text x="870" y="770" class="small-text">* Notes saved to vault/app</text>
  <text x="870" y="790" class="small-text">* Cards moved on boards</text>

  <!-- Arrow to results -->
  <line x1="800" y1="755" x2="840" y2="755" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
