<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      .label { font: bold 13px Arial, sans-serif; fill: #ffffff; }
      .small-text { font: bold 11px Arial, sans-serif; fill: #4b5563; }
      .code { font: bold 11px Consolas, monospace; fill: #1f2937; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a1a2e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#ffffff"/>

  <!-- Header - Slack colors -->
  <rect x="0" y="0" width="800" height="60" fill="#4A154B"/>
  <text x="400" y="35" text-anchor="middle" style="font: bold 24px Arial; fill: white;">💬 SLACK SKILL</text>
  <text x="400" y="52" text-anchor="middle" style="font: bold 12px Arial; fill: #d1c4e9;">React to messages, pin/unpin items in Slack</text>

  <!-- Purpose -->
  <rect x="20" y="75" width="370" height="120" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" rx="8"/>
  <text x="40" y="100" style="font: bold 16px Arial; fill: #1a1a2e;">PURPOSE</text>
  <text x="40" y="125" class="small-text">React to messages with emojis</text>
  <text x="40" y="145" class="small-text">Pin/unpin important messages</text>
  <text x="40" y="165" class="small-text">Manage channel interactions</text>
  <text x="40" y="185" class="small-text">Extended Slack control</text>

  <!-- Requirements -->
  <rect x="410" y="75" width="370" height="120" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="8"/>
  <text x="430" y="100" style="font: bold 16px Arial; fill: #dc2626;">STATUS: 🔴 BLOCKED</text>
  <text x="430" y="125" class="small-text">Missing: config:channels.slack</text>
  <text x="430" y="150" style="font: bold 11px Arial; fill: #dc2626;">SETUP STEPS:</text>
  <text x="430" y="170" class="code">1. Create Slack App at api.slack.com</text>
  <text x="430" y="190" class="code">2. Add botToken + appToken to config</text>

  <!-- Slack Workspace Diagram -->
  <rect x="20" y="210" width="760" height="160" fill="#f0f9ff" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <text x="400" y="235" text-anchor="middle" style="font: bold 16px Arial; fill: #1e40af;">SLACK WORKSPACE INTEGRATION</text>

  <!-- Channels -->
  <rect x="50" y="260" width="200" height="90" fill="#ffffff" stroke="#4A154B" stroke-width="2" rx="6"/>
  <text x="150" y="285" text-anchor="middle" style="font: bold 14px Arial; fill: #4A154B;">SLACK WORKSPACE</text>
  <rect x="65" y="300" width="55" height="35" fill="#4A154B" rx="3"/>
  <text x="92" y="322" text-anchor="middle" style="font: bold 9px Arial; fill: white;">#general</text>
  <rect x="125" y="300" width="55" height="35" fill="#4A154B" rx="3"/>
  <text x="152" y="322" text-anchor="middle" style="font: bold 9px Arial; fill: white;">#random</text>
  <rect x="185" y="300" width="55" height="35" fill="#4A154B" rx="3"/>
  <text x="212" y="322" text-anchor="middle" style="font: bold 9px Arial; fill: white;">#project</text>

  <!-- Arrows -->
  <line x1="250" y1="305" x2="310" y2="305" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="295" style="font: bold 9px Arial; fill: #6b7280;">Bot/App</text>
  <text x="280" y="320" style="font: bold 9px Arial; fill: #6b7280;">Token</text>

  <!-- Gateway -->
  <rect x="320" y="270" width="150" height="70" fill="#3b82f6" rx="6"/>
  <text x="395" y="300" text-anchor="middle" class="label">OPENCLAW</text>
  <text x="395" y="320" text-anchor="middle" class="label">GATEWAY</text>

  <!-- Arrow to actions -->
  <line x1="470" y1="305" x2="530" y2="305" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Actions -->
  <rect x="540" y="255" width="220" height="100" fill="#ffffff" stroke="#10b981" stroke-width="2" rx="6"/>
  <text x="650" y="280" text-anchor="middle" style="font: bold 14px Arial; fill: #059669;">AVAILABLE ACTIONS</text>
  <text x="560" y="305" style="font: bold 11px Arial; fill: #4b5563;">React with emoji</text>
  <text x="560" y="325" style="font: bold 11px Arial; fill: #4b5563;">Pin/Unpin messages</text>
  <text x="560" y="345" style="font: bold 11px Arial; fill: #4b5563;">Channel management</text>

  <!-- Examples -->
  <rect x="20" y="385" width="760" height="100" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <text x="40" y="410" style="font: bold 16px Arial; fill: #d97706;">EXAMPLE COMMANDS (via Slack DM to bot)</text>
  <text x="40" y="440" class="code">pin the message above</text>
  <text x="40" y="460" class="code">react to that with 🎉</text>
  <text x="40" y="480" class="code">unpin the announcement in #general</text>
</svg>
