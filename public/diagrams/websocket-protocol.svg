<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="clientGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1E293B">WebSocket Protocol Communication Flow</text>

  <!-- Section 1: Connection Handshake -->
  <text x="50" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#475569">Phase 1: Connection Handshake</text>
  <rect x="40" y="80" width="400" height="150" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Client box -->
  <rect x="60" y="100" width="100" height="110" rx="6" fill="url(#clientGradient)" filter="url(#shadow)"/>
  <text x="110" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFF">CLIENT</text>
  <text x="110" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#BFDBFE">Web App</text>
  <text x="110" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#BFDBFE">CLI Tool</text>
  <text x="110" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#BFDBFE">Channel</text>

  <!-- Gateway box -->
  <rect x="300" y="100" width="120" height="110" rx="6" fill="url(#gatewayGrad)" filter="url(#shadow)"/>
  <text x="360" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFF">GATEWAY</text>
  <text x="360" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#A7F3D0">Port 18789</text>
  <text x="360" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#A7F3D0">WebSocket</text>
  <text x="360" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#A7F3D0">Server</text>

  <!-- Arrow 1: req:connect -->
  <line x1="160" y1="130" x2="290" y2="130" stroke="#3B82F6" stroke-width="2"/>
  <polygon points="285,124 300,130 285,136" fill="#3B82F6"/>
  <rect x="175" y="117" width="90" height="18" rx="3" fill="#DBEAFE"/>
  <text x="220" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1D4ED8">req:connect</text>

  <!-- Arrow 2: res:hello-ok -->
  <line x1="300" y1="175" x2="170" y2="175" stroke="#10B981" stroke-width="2"/>
  <polygon points="175,169 160,175 175,181" fill="#10B981"/>
  <rect x="185" y="162" width="90" height="18" rx="3" fill="#D1FAE5"/>
  <text x="230" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#059669">res:hello-ok</text>

  <!-- Description box -->
  <text x="60" y="245" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#64748B">Mandatory first frame with authentication token</text>
  <text x="60" y="260" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#64748B">Response includes system snapshot and config</text>

  <!-- Section 2: Message Flow -->
  <text x="480" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#475569">Phase 2: Agent Request Flow</text>
  <rect x="460" y="80" width="420" height="400" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Client box 2 -->
  <rect x="480" y="100" width="100" height="360" rx="6" fill="url(#clientGradient)" filter="url(#shadow)"/>
  <text x="530" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFF">CLIENT</text>

  <!-- Gateway box 2 -->
  <rect x="740" y="100" width="120" height="360" rx="6" fill="url(#gatewayGrad)" filter="url(#shadow)"/>
  <text x="800" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFF">GATEWAY</text>

  <!-- Message 1: req:agent -->
  <line x1="580" y1="160" x2="730" y2="160" stroke="#3B82F6" stroke-width="2"/>
  <polygon points="725,154 740,160 725,166" fill="#3B82F6"/>
  <rect x="605" y="147" width="80" height="18" rx="3" fill="#DBEAFE"/>
  <text x="645" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1D4ED8">req:agent</text>
  <text x="645" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#64748B">Run agent turn</text>

  <!-- Message 2: res:agent (ack) -->
  <line x1="740" y1="210" x2="590" y2="210" stroke="#10B981" stroke-width="2"/>
  <polygon points="595,204 580,210 595,216" fill="#10B981"/>
  <rect x="600" y="197" width="100" height="18" rx="3" fill="#D1FAE5"/>
  <text x="650" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#059669">res:agent (ack)</text>
  <text x="650" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#64748B">runId, status:accepted</text>

  <!-- Message 3: event:agent (stream 1) -->
  <line x1="740" y1="270" x2="590" y2="270" stroke="#F59E0B" stroke-width="2"/>
  <polygon points="595,264 580,270 595,276" fill="#F59E0B"/>
  <rect x="600" y="257" width="100" height="18" rx="3" fill="#FEF3C7"/>
  <text x="650" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#B45309">event:agent</text>
  <text x="650" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#64748B">Streaming output</text>

  <!-- Message 4: event:agent (stream 2) -->
  <line x1="740" y1="330" x2="590" y2="330" stroke="#F59E0B" stroke-width="2"/>
  <polygon points="595,324 580,330 595,336" fill="#F59E0B"/>
  <rect x="600" y="317" width="100" height="18" rx="3" fill="#FEF3C7"/>
  <text x="650" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#B45309">event:agent</text>
  <text x="650" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#64748B">Streaming output</text>

  <!-- Message 5: res:agent (final) -->
  <line x1="740" y1="400" x2="590" y2="400" stroke="#10B981" stroke-width="2"/>
  <polygon points="595,394 580,400 595,406" fill="#10B981"/>
  <rect x="600" y="387" width="100" height="18" rx="3" fill="#D1FAE5"/>
  <text x="650" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#059669">res:agent (final)</text>
  <text x="650" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#64748B">runId, status:ok</text>

  <!-- Legend at bottom left -->
  <rect x="40" y="290" width="400" height="180" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <text x="60" y="315" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E293B">Frame Types Reference</text>
  <line x1="60" y1="325" x2="420" y2="325" stroke="#E2E8F0" stroke-width="1"/>

  <rect x="70" y="340" width="12" height="12" rx="2" fill="#3B82F6"/>
  <text x="90" y="350" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1E293B">Client to Gateway requests</text>

  <rect x="70" y="365" width="12" height="12" rx="2" fill="#10B981"/>
  <text x="90" y="375" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1E293B">Gateway responses (success/error)</text>

  <rect x="70" y="390" width="12" height="12" rx="2" fill="#F59E0B"/>
  <text x="90" y="400" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1E293B">Streaming events (real-time output)</text>

  <text x="70" y="430" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#64748B">All communication uses JSON-based protocol</text>
  <text x="70" y="445" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#64748B">Authentication via 64-character hex token</text>
  <text x="70" y="460" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#64748B">Supports multiple concurrent agent sessions</text>

</svg>
