<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <style type="text/css">
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: bold; fill: #333333; }
      .section-label { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: bold; fill: #333333; }
      .component-title { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
      .component-text { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; }
      .binding-key { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: bold; fill: #1976D2; }
      .binding-value { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: bold; fill: #333333; }
      .match-label { font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: bold; fill: #388E3C; }
      .nomatch-label { font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: bold; fill: #D32F2F; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#388E3C"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D32F2F"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" class="title">Agent Routing (Binding-Based)</text>

  <!-- Incoming Message -->
  <rect x="30" y="80" width="160" height="140" rx="10" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="105" text-anchor="middle" class="section-label">Incoming Message</text>
  <rect x="45" y="120" width="130" height="25" rx="4" fill="#ffffff" stroke="#1976D2" stroke-width="1"/>
  <text x="55" y="137" class="binding-key">channel:</text>
  <text x="110" y="137" class="binding-value">whatsapp</text>
  <rect x="45" y="150" width="130" height="25" rx="4" fill="#ffffff" stroke="#1976D2" stroke-width="1"/>
  <text x="55" y="167" class="binding-key">peer:</text>
  <text x="90" y="167" class="binding-value">+1234567890</text>
  <rect x="45" y="180" width="130" height="25" rx="4" fill="#ffffff" stroke="#1976D2" stroke-width="1"/>
  <text x="55" y="197" class="binding-key">content:</text>
  <text x="100" y="197" class="binding-value">"Hello!"</text>

  <!-- Binding 1 -->
  <g transform="translate(270, 70)">
    <polygon points="100,0 180,60 100,120 20,60" fill="#FFF3E0" stroke="#F57C00" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="50" text-anchor="middle" class="section-label">Binding 1</text>
    <text x="100" y="70" text-anchor="middle" class="binding-key">channel: discord</text>
    <text x="100" y="85" text-anchor="middle" class="binding-key">peer: dev-chat</text>
  </g>

  <!-- Binding 2 -->
  <g transform="translate(270, 210)">
    <polygon points="100,0 180,60 100,120 20,60" fill="#FFF3E0" stroke="#F57C00" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="50" text-anchor="middle" class="section-label">Binding 2</text>
    <text x="100" y="70" text-anchor="middle" class="binding-key">channel: whatsapp</text>
    <text x="100" y="85" text-anchor="middle" class="binding-key">peer: *</text>
  </g>

  <!-- Binding 3 (Default) -->
  <g transform="translate(270, 350)">
    <polygon points="100,0 180,60 100,120 20,60" fill="#E8F5E9" stroke="#388E3C" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="50" text-anchor="middle" class="section-label">Binding 3</text>
    <text x="100" y="70" text-anchor="middle" class="binding-key">(default)</text>
    <text x="100" y="85" text-anchor="middle" class="binding-key">match: {}</text>
  </g>

  <!-- Agent 1: Coding Bot -->
  <rect x="530" y="70" width="160" height="90" rx="10" fill="#7B1FA2" stroke="#4A148C" stroke-width="2" filter="url(#shadow)"/>
  <text x="610" y="100" text-anchor="middle" class="component-title">coding-bot</text>
  <text x="610" y="120" text-anchor="middle" class="component-text">Development</text>
  <text x="610" y="138" text-anchor="middle" class="component-text">Claude Opus</text>

  <!-- Agent 2: WhatsApp Bot -->
  <rect x="530" y="210" width="160" height="90" rx="10" fill="#388E3C" stroke="#1B5E20" stroke-width="2" filter="url(#shadow)"/>
  <text x="610" y="240" text-anchor="middle" class="component-title">whatsapp-agent</text>
  <text x="610" y="260" text-anchor="middle" class="component-text">Personal Assistant</text>
  <text x="610" y="278" text-anchor="middle" class="component-text">Gemini Flash</text>

  <!-- Agent 3: Default -->
  <rect x="530" y="350" width="160" height="90" rx="10" fill="#455A64" stroke="#263238" stroke-width="2" filter="url(#shadow)"/>
  <text x="610" y="380" text-anchor="middle" class="component-title">default</text>
  <text x="610" y="400" text-anchor="middle" class="component-text">General Purpose</text>
  <text x="610" y="418" text-anchor="middle" class="component-text">GPT-4</text>

  <!-- Arrows: Message to Bindings -->
  <path d="M 190 150 L 230 150 L 230 130 L 290 130" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Arrow: No match binding 1 -->
  <line x1="370" y1="190" x2="370" y2="210" stroke="#D32F2F" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <text x="385" y="205" class="nomatch-label">No Match</text>

  <!-- Arrow: Match binding 2 -->
  <line x1="450" y1="270" x2="530" y2="255" stroke="#388E3C" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="475" y="248" class="match-label">MATCH!</text>

  <!-- Arrow: Fallthrough to binding 3 (dashed, showing it's not reached) -->
  <line x1="370" y1="330" x2="370" y2="350" stroke="#999999" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- Result indicator -->
  <rect x="720" y="210" width="150" height="90" rx="10" fill="#E8F5E9" stroke="#388E3C" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="240" text-anchor="middle" class="section-label">Routed To:</text>
  <text x="795" y="265" text-anchor="middle" class="component-title" style="fill:#388E3C">whatsapp-agent</text>
  <text x="795" y="285" text-anchor="middle" class="binding-value">Session created</text>

  <!-- Arrow to result -->
  <line x1="690" y1="255" x2="720" y2="255" stroke="#388E3C" stroke-width="2" marker-end="url(#arrowhead-green)"/>

  <!-- Binding Configuration Example -->
  <rect x="30" y="480" width="840" height="100" rx="8" fill="#f5f5f5" stroke="#E0E0E0" stroke-width="2"/>
  <text x="50" y="505" class="section-label">Configuration Example (openclaw.json)</text>
  <text x="50" y="530" font-family="monospace" font-size="11" font-weight="bold" fill="#333">
    "bindings": [
  </text>
  <text x="70" y="548" font-family="monospace" font-size="11" font-weight="bold" fill="#333">
    { "agentId": "coding-bot", "match": { "channel": "discord", "peer": "dev-chat" } },
  </text>
  <text x="70" y="566" font-family="monospace" font-size="11" font-weight="bold" fill="#333">
    { "agentId": "whatsapp-agent", "match": { "channel": "whatsapp" } },
  </text>
  <text x="70" y="584" font-family="monospace" font-size="11" font-weight="bold" fill="#333">
    { "agentId": "default", "match": {} }  // Fallback
  </text>

  <!-- Legend -->
  <rect x="720" y="350" width="150" height="100" rx="8" fill="#ffffff" stroke="#E0E0E0" stroke-width="1"/>
  <text x="735" y="372" class="section-label">Legend</text>
  <line x1="735" y1="390" x2="765" y2="390" stroke="#388E3C" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="775" y="395" class="match-label">Match</text>
  <line x1="735" y1="415" x2="765" y2="415" stroke="#D32F2F" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <text x="775" y="420" class="nomatch-label">No Match</text>
  <polygon points="755,440 770,448 755,456 740,448" fill="#FFF3E0" stroke="#F57C00" stroke-width="1"/>
  <text x="780" y="452" class="binding-value" font-size="10">Binding</text>
</svg>
