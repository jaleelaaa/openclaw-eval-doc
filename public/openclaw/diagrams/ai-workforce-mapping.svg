<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1100" height="750" viewBox="0 0 1100 750">
  <defs>
    <style type="text/css">
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: bold; fill: #333333; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #666666; }
      .header { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: bold; fill: #ffffff; }
      .row-title { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: bold; fill: #333333; }
      .row-text { font-family: Arial, Helvetica, sans-serif; font-size: 10px; fill: #333333; }
      .tech-title { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: bold; fill: #333333; }
      .tech-text { font-family: Arial, Helvetica, sans-serif; font-size: 10px; fill: #666666; }
      .customer-title { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: bold; fill: #333333; }
      .customer-text { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; }
      .customer-sub { font-family: Arial, Helvetica, sans-serif; font-size: 10px; fill: #ffffff; }
    </style>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F57C00"/>
    </marker>
    <marker id="arrow-black" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="750" fill="#ffffff"/>

  <!-- Title -->
  <text x="550" y="30" text-anchor="middle" class="title">OpenClaw to AI Workforce&#8482; Architecture Mapping</text>
  <text x="550" y="55" text-anchor="middle" class="subtitle">Candidate Design Principles for Opsfolio Implementation with Spry, surveilr, and Deno</text>

  <!-- Column Headers -->
  <rect x="35" y="75" width="340" height="35" rx="6" fill="#1976D2" stroke="#0D47A1" stroke-width="2"/>
  <text x="205" y="98" text-anchor="middle" class="header">OpenClaw Pattern</text>

  <rect x="410" y="75" width="340" height="35" rx="6" fill="#388E3C" stroke="#1B5E20" stroke-width="2"/>
  <text x="580" y="98" text-anchor="middle" class="header">AI Workforce&#8482; Application</text>

  <rect x="785" y="75" width="150" height="35" rx="6" fill="#7B1FA2" stroke="#4A148C" stroke-width="2"/>
  <text x="860" y="98" text-anchor="middle" class="header">Technology Stack</text>

  <!-- Row 1: Gateway Pattern -->
  <rect x="35" y="125" width="340" height="85" rx="6" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="50" y="148" class="row-title">Gateway-Centric Architecture</text>
  <text x="50" y="165" class="row-text">Single WebSocket control plane</text>
  <text x="50" y="180" class="row-text">Multiplexed HTTP + WS on one port</text>
  <text x="50" y="195" class="row-text">Token-based authentication</text>

  <rect x="410" y="125" width="340" height="85" rx="6" fill="#E8F5E9" stroke="#388E3C" stroke-width="2"/>
  <text x="425" y="148" class="row-title">Unified API Gateway</text>
  <text x="425" y="165" class="row-text">Single entry point for all Opsfolio agents</text>
  <text x="425" y="180" class="row-text">Customer-scoped authentication</text>
  <text x="425" y="195" class="row-text">FOPC/CIVCO/POCN/TechBD routing</text>

  <rect x="785" y="125" width="150" height="85" rx="6" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>
  <text x="860" y="153" text-anchor="middle" class="tech-title">Spry</text>
  <text x="860" y="173" text-anchor="middle" class="tech-text">HTTP Framework</text>
  <text x="860" y="190" text-anchor="middle" class="tech-text">WS Support</text>

  <!-- Row 2: Multi-Agent -->
  <rect x="35" y="225" width="340" height="85" rx="6" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="50" y="248" class="row-title">Multi-Agent Routing</text>
  <text x="50" y="265" class="row-text">Binding-based agent selection</text>
  <text x="50" y="280" class="row-text">Isolated workspaces per agent</text>
  <text x="50" y="295" class="row-text">Per-agent credentials &amp; sessions</text>

  <rect x="410" y="225" width="340" height="85" rx="6" fill="#E8F5E9" stroke="#388E3C" stroke-width="2"/>
  <text x="425" y="248" class="row-title">Organization-Scoped Agents</text>
  <text x="425" y="265" class="row-text">Per-customer agent isolation</text>
  <text x="425" y="280" class="row-text">Compliance-aware routing rules</text>
  <text x="425" y="295" class="row-text">Audit trail per organization</text>

  <rect x="785" y="225" width="150" height="85" rx="6" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>
  <text x="860" y="253" text-anchor="middle" class="tech-title">surveilr</text>
  <text x="860" y="273" text-anchor="middle" class="tech-text">State mgmt</text>
  <text x="860" y="290" text-anchor="middle" class="tech-text">Audit logging</text>

  <!-- Row 3: Plugin Architecture -->
  <rect x="35" y="325" width="340" height="85" rx="6" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="50" y="348" class="row-title">Plugin SDK + Runtime</text>
  <text x="50" y="365" class="row-text">Compile-time SDK (types, helpers)</text>
  <text x="50" y="380" class="row-text">Injected runtime (core behaviors)</text>
  <text x="50" y="395" class="row-text">Semver stability guarantees</text>

  <rect x="410" y="325" width="340" height="85" rx="6" fill="#E8F5E9" stroke="#388E3C" stroke-width="2"/>
  <text x="425" y="348" class="row-title">Deno Module System</text>
  <text x="425" y="365" class="row-text">TypeScript-first plugins</text>
  <text x="425" y="380" class="row-text">ESM import maps for stability</text>
  <text x="425" y="395" class="row-text">Runtime capability injection</text>

  <rect x="785" y="325" width="150" height="85" rx="6" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>
  <text x="860" y="353" text-anchor="middle" class="tech-title">Deno</text>
  <text x="860" y="373" text-anchor="middle" class="tech-text">TypeScript</text>
  <text x="860" y="390" text-anchor="middle" class="tech-text">Native modules</text>

  <!-- Row 4: Session Management -->
  <rect x="35" y="425" width="340" height="85" rx="6" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="50" y="448" class="row-title">File-Based State</text>
  <text x="50" y="465" class="row-text">JSON config with hot-reload</text>
  <text x="50" y="480" class="row-text">Session history as JSON files</text>
  <text x="50" y="495" class="row-text">Workspace per agent</text>

  <rect x="410" y="425" width="340" height="85" rx="6" fill="#E8F5E9" stroke="#388E3C" stroke-width="2"/>
  <text x="425" y="448" class="row-title">SQLite + Resource SQL</text>
  <text x="425" y="465" class="row-text">surveilr SQLite state store</text>
  <text x="425" y="480" class="row-text">Compliance-ready audit tables</text>
  <text x="425" y="495" class="row-text">Resource SQL for queries</text>

  <rect x="785" y="425" width="150" height="85" rx="6" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>
  <text x="860" y="453" text-anchor="middle" class="tech-title">SQLite</text>
  <text x="860" y="473" text-anchor="middle" class="tech-text">Resource SQL</text>
  <text x="860" y="490" text-anchor="middle" class="tech-text">surveilr</text>

  <!-- Row 5: Channel Connectors -->
  <rect x="35" y="525" width="340" height="85" rx="6" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="50" y="548" class="row-title">Channel Connectors</text>
  <text x="50" y="565" class="row-text">WhatsApp, Telegram, Discord, Slack</text>
  <text x="50" y="580" class="row-text">Standardized message format</text>
  <text x="50" y="595" class="row-text">Platform-specific adapters</text>

  <rect x="410" y="525" width="340" height="85" rx="6" fill="#E8F5E9" stroke="#388E3C" stroke-width="2"/>
  <text x="425" y="548" class="row-title">Enterprise Connectors</text>
  <text x="425" y="565" class="row-text">Slack, MS Teams, Email</text>
  <text x="425" y="580" class="row-text">Webhook ingestion</text>
  <text x="425" y="595" class="row-text">FHIR/HL7 for healthcare data</text>

  <rect x="785" y="525" width="150" height="85" rx="6" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>
  <text x="860" y="553" text-anchor="middle" class="tech-title">Custom</text>
  <text x="860" y="573" text-anchor="middle" class="tech-text">FHIR SDK</text>
  <text x="860" y="590" text-anchor="middle" class="tech-text">Webhook</text>

  <!-- Mapping Arrows -->
  <line x1="375" y1="168" x2="410" y2="168" stroke="#F57C00" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <line x1="375" y1="268" x2="410" y2="268" stroke="#F57C00" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <line x1="375" y1="368" x2="410" y2="368" stroke="#F57C00" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <line x1="375" y1="468" x2="410" y2="468" stroke="#F57C00" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <line x1="375" y1="568" x2="410" y2="568" stroke="#F57C00" stroke-width="3" marker-end="url(#arrow-orange)"/>

  <!-- Customer Section -->
  <rect x="35" y="635" width="900" height="95" rx="10" fill="#FFF3E0" stroke="#F57C00" stroke-width="2"/>
  <text x="50" y="658" class="customer-title">Target Customers (Implementation Priority)</text>

  <!-- Customer boxes -->
  <rect x="55" y="670" width="100" height="50" rx="6" fill="#F57C00" stroke="#E65100" stroke-width="2"/>
  <text x="105" y="690" text-anchor="middle" class="customer-text">1. FOPC</text>
  <text x="105" y="708" text-anchor="middle" class="customer-sub">Family Oriented</text>

  <rect x="170" y="670" width="100" height="50" rx="6" fill="#F57C00" stroke="#E65100" stroke-width="2"/>
  <text x="220" y="690" text-anchor="middle" class="customer-text">2. CIVCO</text>
  <text x="220" y="708" text-anchor="middle" class="customer-sub">Healthcare</text>

  <rect x="285" y="670" width="100" height="50" rx="6" fill="#FFA000" stroke="#FF6F00" stroke-width="2"/>
  <text x="335" y="690" text-anchor="middle" class="customer-text">3. POCN</text>
  <text x="335" y="708" text-anchor="middle" class="customer-sub">Point of Care</text>

  <rect x="400" y="670" width="100" height="50" rx="6" fill="#FFA000" stroke="#FF6F00" stroke-width="2"/>
  <text x="450" y="690" text-anchor="middle" class="customer-text">4. TechBD</text>
  <text x="450" y="708" text-anchor="middle" class="customer-sub">Technology</text>

  <!-- Priority Arrow -->
  <line x1="530" y1="695" x2="680" y2="695" stroke="#333333" stroke-width="3" marker-end="url(#arrow-black)"/>
  <text x="605" y="680" text-anchor="middle" style="font-family: Arial; font-size: 11px; font-weight: bold; fill: #333333;">Implementation Priority</text>

</svg>
