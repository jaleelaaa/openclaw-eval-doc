<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1100" height="900" viewBox="0 0 1100 900">
  <defs>
    <style type="text/css">
      .title { font: bold 18px 'Helvetica Neue', Arial, sans-serif; fill: #1a1a2e; }
      .subtitle { font: bold 12px 'Helvetica Neue', Arial, sans-serif; fill: #666666; }
      .section-title { font: bold 13px 'Helvetica Neue', Arial, sans-serif; fill: #1a1a2e; }
      .box-title { font: bold 12px 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
      .item-title { font: bold 11px 'Helvetica Neue', Arial, sans-serif; fill: #1a1a2e; }
      .item-detail { font: bold 10px 'Helvetica Neue', Arial, sans-serif; fill: #666666; }
      .code-text { font: bold 10px 'Courier New', monospace; fill: #1a1a2e; }
      .code-text-light { font: bold 10px 'Courier New', monospace; fill: #ffffff; }
      .priority-high { font: bold 9px 'Helvetica Neue', Arial, sans-serif; fill: #e74c3c; }
      .priority-med { font: bold 9px 'Helvetica Neue', Arial, sans-serif; fill: #f39c12; }
      .priority-low { font: bold 9px 'Helvetica Neue', Arial, sans-serif; fill: #27ae60; }
    </style>
    <linearGradient id="envGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E91E63"/>
      <stop offset="100%" style="stop-color:#C2185B"/>
    </linearGradient>
    <linearGradient id="configGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3F51B5"/>
      <stop offset="100%" style="stop-color:#303F9F"/>
    </linearGradient>
    <linearGradient id="fileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#009688"/>
      <stop offset="100%" style="stop-color:#00796B"/>
    </linearGradient>
    <linearGradient id="providerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF5722"/>
      <stop offset="100%" style="stop-color:#E64A19"/>
    </linearGradient>
    <linearGradient id="channelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#673AB7"/>
      <stop offset="100%" style="stop-color:#512DA8"/>
    </linearGradient>
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3"/>
      <stop offset="100%" style="stop-color:#1976D2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E91E63"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="900" fill="#fafbfc"/>

  <!-- Title -->
  <text x="550" y="35" text-anchor="middle" class="title">OpenClaw Configuration Hierarchy</text>
  <text x="550" y="55" text-anchor="middle" class="subtitle">Environment variables, configuration files, and provider setup</text>

  <!-- Priority Flow Arrow -->
  <rect x="50" y="75" width="1000" height="35" rx="5" fill="#fff3e0" stroke="#FF9800" stroke-width="1"/>
  <text x="80" y="97" class="section-title">Configuration Priority (High to Low):</text>
  <text x="310" y="97" class="priority-high">CLI Arguments</text>
  <text x="420" y="97" style="font: bold 12px 'Helvetica Neue', Arial, sans-serif; fill: #666666;">→</text>
  <text x="440" y="97" class="priority-high">Environment Variables</text>
  <text x="590" y="97" style="font: bold 12px 'Helvetica Neue', Arial, sans-serif; fill: #666666;">→</text>
  <text x="610" y="97" class="priority-med">openclaw.json</text>
  <text x="720" y="97" style="font: bold 12px 'Helvetica Neue', Arial, sans-serif; fill: #666666;">→</text>
  <text x="740" y="97" class="priority-low">Default Values</text>

  <!-- Environment Variables Section -->
  <rect x="50" y="125" width="500" height="320" rx="8" fill="#fce4ec" stroke="#E91E63" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="125" width="500" height="35" rx="8" fill="url(#envGrad)"/>
  <text x="300" y="148" text-anchor="middle" class="box-title">Environment Variables</text>

  <!-- Required Env Vars -->
  <rect x="70" y="175" width="220" height="250" rx="6" fill="#ffffff" stroke="#F48FB1" stroke-width="1"/>
  <text x="180" y="195" text-anchor="middle" class="section-title">Required / Recommended</text>

  <text x="85" y="220" class="code-text">OPENCLAW_GATEWAY_TOKEN</text>
  <text x="85" y="235" class="item-detail">Gateway authentication (64-char hex)</text>

  <text x="85" y="260" class="code-text">OPENCLAW_CONFIG_DIR</text>
  <text x="85" y="275" class="item-detail">Default: ~/.openclaw</text>

  <text x="85" y="300" class="code-text">OPENCLAW_WORKSPACE_DIR</text>
  <text x="85" y="315" class="item-detail">Default: ~/.openclaw/workspace</text>

  <text x="85" y="340" class="code-text">OPENCLAW_GATEWAY_PORT</text>
  <text x="85" y="355" class="item-detail">Default: 18789</text>

  <text x="85" y="380" class="code-text">OPENCLAW_GATEWAY_BIND</text>
  <text x="85" y="395" class="item-detail">Options: lan, localhost, 0.0.0.0</text>

  <!-- Optional Env Vars -->
  <rect x="310" y="175" width="220" height="250" rx="6" fill="#ffffff" stroke="#F48FB1" stroke-width="1"/>
  <text x="420" y="195" text-anchor="middle" class="section-title">Optional / Provider Keys</text>

  <text x="325" y="220" class="code-text">CLAUDE_AI_SESSION_KEY</text>
  <text x="325" y="235" class="item-detail">Anthropic Claude session</text>

  <text x="325" y="260" class="code-text">GOOGLE_API_KEY</text>
  <text x="325" y="275" class="item-detail">Google Gemini access</text>

  <text x="325" y="300" class="code-text">OPENAI_API_KEY</text>
  <text x="325" y="315" class="item-detail">OpenAI API access</text>

  <text x="325" y="340" class="code-text">ANTHROPIC_API_KEY</text>
  <text x="325" y="355" class="item-detail">Anthropic API access</text>

  <text x="325" y="380" class="code-text">TWILIO_*</text>
  <text x="325" y="395" class="item-detail">Twilio WhatsApp integration</text>

  <!-- Main Configuration File Section -->
  <rect x="580" y="125" width="480" height="320" rx="8" fill="#e8eaf6" stroke="#3F51B5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="580" y="125" width="480" height="35" rx="8" fill="url(#configGrad)"/>
  <text x="820" y="148" text-anchor="middle" class="box-title">openclaw.json (Main Configuration)</text>

  <!-- Config JSON Structure -->
  <rect x="600" y="175" width="440" height="250" rx="6" fill="#ffffff" stroke="#7986CB" stroke-width="1"/>

  <text x="620" y="200" class="code-text">{</text>
  <text x="635" y="220" class="code-text">"gateway": {</text>
  <text x="650" y="240" class="code-text">"auth": { "token": "..." },</text>
  <text x="650" y="260" class="code-text">"port": 18789,</text>
  <text x="650" y="280" class="code-text">"bind": "lan"</text>
  <text x="635" y="300" class="code-text">},</text>
  <text x="635" y="320" class="code-text">"agents": {</text>
  <text x="650" y="340" class="code-text">"defaults": { "model": {...} }</text>
  <text x="635" y="360" class="code-text">},</text>
  <text x="635" y="380" class="code-text">"channels": { ... },</text>
  <text x="635" y="400" class="code-text">"plugins": [ ... ]</text>
  <text x="620" y="420" class="code-text">}</text>

  <!-- File System Structure -->
  <rect x="50" y="465" width="320" height="280" rx="8" fill="#e0f2f1" stroke="#009688" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="465" width="320" height="35" rx="8" fill="url(#fileGrad)"/>
  <text x="210" y="488" text-anchor="middle" class="box-title">Configuration Directory Structure</text>

  <text x="70" y="520" class="code-text">~/.openclaw/</text>
  <text x="85" y="540" class="code-text">├── openclaw.json</text>
  <text x="200" y="540" class="item-detail">Main config</text>
  <text x="85" y="560" class="code-text">├── openclaw.json.bak</text>
  <text x="230" y="560" class="item-detail">Backup</text>
  <text x="85" y="580" class="code-text">├── agents/</text>
  <text x="160" y="580" class="item-detail">Per-agent state</text>
  <text x="100" y="600" class="code-text">│   └── &lt;agentId&gt;/</text>
  <text x="100" y="620" class="code-text">│       ├── agent/</text>
  <text x="100" y="640" class="code-text">│       └── sessions/</text>
  <text x="85" y="660" class="code-text">├── canvas/</text>
  <text x="160" y="660" class="item-detail">File server</text>
  <text x="85" y="680" class="code-text">├── cron/</text>
  <text x="140" y="680" class="item-detail">Scheduled tasks</text>
  <text x="85" y="700" class="code-text">├── identity/</text>
  <text x="170" y="700" class="item-detail">Device keys</text>
  <text x="85" y="720" class="code-text">└── workspace/</text>
  <text x="185" y="720" class="item-detail">Agent files</text>

  <!-- Provider Configuration -->
  <rect x="400" y="465" width="340" height="280" rx="8" fill="#fbe9e7" stroke="#FF5722" stroke-width="2" filter="url(#shadow)"/>
  <rect x="400" y="465" width="340" height="35" rx="8" fill="url(#providerGrad)"/>
  <text x="570" y="488" text-anchor="middle" class="box-title">LLM Provider Configuration</text>

  <rect x="420" y="515" width="300" height="210" rx="6" fill="#ffffff" stroke="#FFAB91" stroke-width="1"/>

  <!-- Provider List -->
  <text x="440" y="540" class="item-title">Google Gemini</text>
  <text x="440" y="555" class="code-text">model: "google/gemini-3-flash-preview"</text>
  <text x="440" y="570" class="item-detail">Requires: GOOGLE_API_KEY</text>

  <line x1="440" y1="580" x2="700" y2="580" stroke="#FFCCBC" stroke-width="1"/>

  <text x="440" y="600" class="item-title">Anthropic Claude</text>
  <text x="440" y="615" class="code-text">model: "anthropic/claude-sonnet"</text>
  <text x="440" y="630" class="item-detail">Requires: ANTHROPIC_API_KEY</text>

  <line x1="440" y1="640" x2="700" y2="640" stroke="#FFCCBC" stroke-width="1"/>

  <text x="440" y="660" class="item-title">OpenAI</text>
  <text x="440" y="675" class="code-text">model: "openai/gpt-4"</text>
  <text x="440" y="690" class="item-detail">Requires: OPENAI_API_KEY</text>

  <line x1="440" y1="700" x2="700" y2="700" stroke="#FFCCBC" stroke-width="1"/>

  <text x="440" y="720" class="item-title">Local (Ollama)</text>
  <text x="440" y="735" class="code-text">model: "ollama/llama3"</text>

  <!-- Channel Configuration -->
  <rect x="770" y="465" width="290" height="280" rx="8" fill="#ede7f6" stroke="#673AB7" stroke-width="2" filter="url(#shadow)"/>
  <rect x="770" y="465" width="290" height="35" rx="8" fill="url(#channelGrad)"/>
  <text x="915" y="488" text-anchor="middle" class="box-title">Channel Configuration</text>

  <rect x="790" y="515" width="250" height="210" rx="6" fill="#ffffff" stroke="#B39DDB" stroke-width="1"/>

  <!-- Channel Commands -->
  <text x="810" y="540" class="item-title">WhatsApp (QR Code)</text>
  <text x="810" y="560" class="code-text">openclaw providers login</text>

  <line x1="810" y1="575" x2="1020" y2="575" stroke="#D1C4E9" stroke-width="1"/>

  <text x="810" y="595" class="item-title">Telegram</text>
  <text x="810" y="615" class="code-text">openclaw providers add \</text>
  <text x="820" y="630" class="code-text">--provider telegram \</text>
  <text x="820" y="645" class="code-text">--token &lt;bot_token&gt;</text>

  <line x1="810" y1="660" x2="1020" y2="660" stroke="#D1C4E9" stroke-width="1"/>

  <text x="810" y="680" class="item-title">Discord</text>
  <text x="810" y="700" class="code-text">openclaw providers add \</text>
  <text x="820" y="715" class="code-text">--provider discord \</text>
  <text x="820" y="730" class="code-text">--token &lt;bot_token&gt;</text>

  <!-- Agent Configuration -->
  <rect x="50" y="765" width="1010" height="110" rx="8" fill="#e3f2fd" stroke="#2196F3" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="765" width="1010" height="35" rx="8" fill="url(#agentGrad)"/>
  <text x="555" y="788" text-anchor="middle" class="box-title">Agent Workspace Configuration</text>

  <!-- Workspace Files -->
  <rect x="70" y="815" width="300" height="45" rx="5" fill="#ffffff" stroke="#90CAF9" stroke-width="1"/>
  <text x="85" y="835" class="item-title">AGENTS.md</text>
  <text x="85" y="850" class="item-detail">Agent persona and behavior definitions</text>

  <rect x="390" y="815" width="300" height="45" rx="5" fill="#ffffff" stroke="#90CAF9" stroke-width="1"/>
  <text x="405" y="835" class="item-title">SOUL.md</text>
  <text x="405" y="850" class="item-detail">Agent personality and communication style</text>

  <rect x="710" y="815" width="330" height="45" rx="5" fill="#ffffff" stroke="#90CAF9" stroke-width="1"/>
  <text x="725" y="835" class="item-title">USER.md</text>
  <text x="725" y="850" class="item-detail">User preferences and context for personalization</text>

  <!-- Connection Arrows -->
  <path d="M300,445 L300,463" style="fill:none;stroke:#E91E63;stroke-width:2;" marker-end="url(#arrow-red)"/>
  <text x="310" y="455" class="priority-high">overrides</text>

  <path d="M820,445 L570,463" style="fill:none;stroke:#3F51B5;stroke-width:2;stroke-dasharray:4,2;" marker-end="url(#arrow)"/>
</svg>