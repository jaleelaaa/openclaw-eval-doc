<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1100" height="800" viewBox="0 0 1100 800">
  <defs>
    <style type="text/css">
      .title { font: bold 18px 'Helvetica Neue', Arial, sans-serif; fill: #1a1a2e; }
      .subtitle { font: bold 12px 'Helvetica Neue', Arial, sans-serif; fill: #666666; }
      .section-title { font: bold 13px 'Helvetica Neue', Arial, sans-serif; fill: #1a1a2e; }
      .box-title { font: bold 12px 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
      .step-num { font: bold 16px 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
      .step-title { font: bold 12px 'Helvetica Neue', Arial, sans-serif; fill: #1a1a2e; }
      .code-text { font: bold 11px 'Courier New', monospace; fill: #1a1a2e; }
      .item-detail { font: bold 10px 'Helvetica Neue', Arial, sans-serif; fill: #666666; }
      .check-text { font: bold 10px 'Helvetica Neue', Arial, sans-serif; fill: #27ae60; }
    </style>
    <linearGradient id="prereqGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF5722"/>
      <stop offset="100%" style="stop-color:#E64A19"/>
    </linearGradient>
    <linearGradient id="installGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50"/>
      <stop offset="100%" style="stop-color:#388E3C"/>
    </linearGradient>
    <linearGradient id="configGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3"/>
      <stop offset="100%" style="stop-color:#1976D2"/>
    </linearGradient>
    <linearGradient id="runGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9C27B0"/>
      <stop offset="100%" style="stop-color:#7B1FA2"/>
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#607D8B"/>
      <stop offset="100%" style="stop-color:#455A64"/>
    </linearGradient>
    <linearGradient id="sourceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#795548"/>
      <stop offset="100%" style="stop-color:#5D4037"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="800" fill="#fafbfc"/>

  <!-- Title -->
  <text x="550" y="35" text-anchor="middle" class="title">OpenClaw Native Installation Architecture</text>
  <text x="550" y="55" text-anchor="middle" class="subtitle">Step-by-step installation without Docker</text>

  <!-- NPM Installation Path -->
  <rect x="50" y="80" width="500" height="700" rx="10" fill="#e8f5e9" stroke="#4CAF50" stroke-width="2"/>
  <text x="300" y="105" text-anchor="middle" class="section-title">NPM Global Installation (Recommended)</text>

  <!-- Source Installation Path -->
  <rect x="580" y="80" width="480" height="700" rx="10" fill="#efebe9" stroke="#795548" stroke-width="2"/>
  <text x="820" y="105" text-anchor="middle" class="section-title">Source Installation (Development)</text>

  <!-- Step 1: Prerequisites (Both) -->
  <rect x="70" y="130" width="460" height="120" rx="8" fill="#fbe9e7" stroke="#FF5722" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="95" cy="155" r="18" fill="url(#prereqGrad)"/>
  <text x="95" y="160" text-anchor="middle" class="step-num">1</text>
  <text x="125" y="160" class="step-title">Prerequisites</text>

  <text x="90" y="185" class="code-text">Node.js >= 22.12.0</text>
  <text x="280" y="185" class="item-detail">LTS recommended</text>
  <text x="90" y="205" class="code-text">npm or pnpm</text>
  <text x="200" y="205" class="item-detail">Package manager</text>
  <text x="90" y="225" class="code-text">Git (optional)</text>
  <text x="200" y="225" class="item-detail">For version control</text>

  <!-- Verification commands -->
  <rect x="90" y="238" width="150" height="20" rx="3" fill="#ffffff" stroke="#FFCCBC"/>
  <text x="100" y="252" class="code-text">node --version</text>
  <rect x="250" y="238" width="150" height="20" rx="3" fill="#ffffff" stroke="#FFCCBC"/>
  <text x="260" y="252" class="code-text">npm --version</text>

  <!-- Source Prerequisites -->
  <rect x="600" y="130" width="440" height="120" rx="8" fill="#fbe9e7" stroke="#FF5722" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="625" cy="155" r="18" fill="url(#prereqGrad)"/>
  <text x="625" y="160" text-anchor="middle" class="step-num">1</text>
  <text x="655" y="160" class="step-title">Prerequisites</text>

  <text x="620" y="185" class="code-text">Node.js >= 22.12.0</text>
  <text x="620" y="205" class="code-text">pnpm >= 10.23.0</text>
  <text x="780" y="205" class="item-detail">Required</text>
  <text x="620" y="225" class="code-text">Git</text>
  <text x="670" y="225" class="item-detail">Required for clone</text>

  <rect x="620" y="238" width="200" height="20" rx="3" fill="#ffffff" stroke="#FFCCBC"/>
  <text x="630" y="252" class="code-text">npm install -g pnpm</text>

  <!-- Step 2: Install (NPM) -->
  <rect x="70" y="270" width="460" height="100" rx="8" fill="#e8f5e9" stroke="#4CAF50" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="95" cy="295" r="18" fill="url(#installGrad)"/>
  <text x="95" y="300" text-anchor="middle" class="step-num">2</text>
  <text x="125" y="300" class="step-title">Install OpenClaw Globally</text>

  <rect x="90" y="315" width="420" height="40" rx="5" fill="#ffffff" stroke="#A5D6A7"/>
  <text x="105" y="340" class="code-text">npm install -g openclaw@latest</text>
  <text x="105" y="355" class="item-detail"># Or: pnpm add -g openclaw@latest</text>

  <!-- Step 2: Clone & Build (Source) -->
  <rect x="600" y="270" width="440" height="150" rx="8" fill="#d7ccc8" stroke="#795548" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="625" cy="295" r="18" fill="url(#sourceGrad)"/>
  <text x="625" y="300" text-anchor="middle" class="step-num">2</text>
  <text x="655" y="300" class="step-title">Clone and Build</text>

  <rect x="620" y="315" width="400" height="90" rx="5" fill="#ffffff" stroke="#BCAAA4"/>
  <text x="635" y="335" class="code-text">git clone https://github.com/openclaw/openclaw.git</text>
  <text x="635" y="355" class="code-text">cd openclaw</text>
  <text x="635" y="375" class="code-text">pnpm install</text>
  <text x="635" y="395" class="code-text">pnpm build &amp;&amp; pnpm ui:build</text>

  <!-- Step 3: Onboard (NPM) -->
  <rect x="70" y="390" width="460" height="120" rx="8" fill="#e3f2fd" stroke="#2196F3" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="95" cy="415" r="18" fill="url(#configGrad)"/>
  <text x="95" y="420" text-anchor="middle" class="step-num">3</text>
  <text x="125" y="420" class="step-title">Run Onboarding Wizard</text>

  <rect x="90" y="435" width="420" height="25" rx="5" fill="#ffffff" stroke="#90CAF9"/>
  <text x="105" y="453" class="code-text">openclaw onboard --install-daemon</text>

  <text x="90" y="480" class="item-detail">This wizard will:</text>
  <text x="100" y="495" class="check-text">✓ Create ~/.openclaw directory</text>
  <text x="290" y="495" class="check-text">✓ Generate gateway token</text>
  <text x="100" y="510" class="check-text">✓ Configure LLM provider</text>
  <text x="290" y="510" class="check-text">✓ Install system daemon</text>

  <!-- Step 3: Onboard (Source) -->
  <rect x="600" y="440" width="440" height="100" rx="8" fill="#e3f2fd" stroke="#2196F3" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="625" cy="465" r="18" fill="url(#configGrad)"/>
  <text x="625" y="470" text-anchor="middle" class="step-num">3</text>
  <text x="655" y="470" class="step-title">Run Onboarding (Dev Mode)</text>

  <rect x="620" y="490" width="400" height="35" rx="5" fill="#ffffff" stroke="#90CAF9"/>
  <text x="635" y="510" class="code-text">pnpm openclaw onboard</text>
  <text x="635" y="525" class="item-detail"># Skip daemon for development</text>

  <!-- Step 4: Configure (NPM) -->
  <rect x="70" y="530" width="460" height="120" rx="8" fill="#e3f2fd" stroke="#2196F3" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="95" cy="555" r="18" fill="url(#configGrad)"/>
  <text x="95" y="560" text-anchor="middle" class="step-num">4</text>
  <text x="125" y="560" class="step-title">Configure API Keys</text>

  <text x="90" y="585" class="item-detail">Set environment variables or use CLI:</text>
  <rect x="90" y="595" width="420" height="45" rx="5" fill="#ffffff" stroke="#90CAF9"/>
  <text x="105" y="615" class="code-text">export GOOGLE_API_KEY="your-key"</text>
  <text x="105" y="635" class="code-text">openclaw config set agents.defaults.model.primary \</text>
  <text x="115" y="650" class="code-text">"google/gemini-3-flash-preview"</text>

  <!-- Step 4: Configure (Source) -->
  <rect x="600" y="560" width="440" height="100" rx="8" fill="#e3f2fd" stroke="#2196F3" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="625" cy="585" r="18" fill="url(#configGrad)"/>
  <text x="625" y="590" text-anchor="middle" class="step-num">4</text>
  <text x="655" y="590" class="step-title">Development Configuration</text>

  <rect x="620" y="610" width="400" height="35" rx="5" fill="#ffffff" stroke="#90CAF9"/>
  <text x="635" y="630" class="code-text">cp .env.example .env</text>
  <text x="635" y="645" class="item-detail"># Edit .env with your API keys</text>

  <!-- Step 5: Start (NPM) -->
  <rect x="70" y="670" width="460" height="90" rx="8" fill="#f3e5f5" stroke="#9C27B0" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="95" cy="695" r="18" fill="url(#runGrad)"/>
  <text x="95" y="700" text-anchor="middle" class="step-num">5</text>
  <text x="125" y="700" class="step-title">Start Gateway</text>

  <rect x="90" y="715" width="420" height="35" rx="5" fill="#ffffff" stroke="#CE93D8"/>
  <text x="105" y="735" class="code-text">openclaw gateway --port 18789 --verbose</text>
  <text x="105" y="750" class="item-detail"># Access Control UI at http://127.0.0.1:18789</text>

  <!-- Step 5: Start (Source) -->
  <rect x="600" y="680" width="440" height="80" rx="8" fill="#f3e5f5" stroke="#9C27B0" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="625" cy="705" r="18" fill="url(#runGrad)"/>
  <text x="625" y="710" text-anchor="middle" class="step-num">5</text>
  <text x="655" y="710" class="step-title">Start Development Server</text>

  <rect x="620" y="730" width="400" height="25" rx="5" fill="#ffffff" stroke="#CE93D8"/>
  <text x="635" y="748" class="code-text">pnpm gateway:dev</text>

  <!-- Arrows -->
  <path d="M300,250 L300,268" style="fill:none;stroke:#4a5568;stroke-width:2;" marker-end="url(#arrow)"/>
  <path d="M300,370 L300,388" style="fill:none;stroke:#4a5568;stroke-width:2;" marker-end="url(#arrow)"/>
  <path d="M300,510 L300,528" style="fill:none;stroke:#4a5568;stroke-width:2;" marker-end="url(#arrow)"/>
  <path d="M300,650 L300,668" style="fill:none;stroke:#4a5568;stroke-width:2;" marker-end="url(#arrow)"/>

  <path d="M820,250 L820,268" style="fill:none;stroke:#4a5568;stroke-width:2;" marker-end="url(#arrow)"/>
  <path d="M820,420 L820,438" style="fill:none;stroke:#4a5568;stroke-width:2;" marker-end="url(#arrow)"/>
  <path d="M820,540 L820,558" style="fill:none;stroke:#4a5568;stroke-width:2;" marker-end="url(#arrow)"/>
  <path d="M820,660 L820,678" style="fill:none;stroke:#4a5568;stroke-width:2;" marker-end="url(#arrow)"/>
</svg>