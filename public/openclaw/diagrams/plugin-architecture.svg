<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1000" height="650" viewBox="0 0 1000 650">
  <defs>
    <style type="text/css">
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: bold; fill: #333333; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #666666; }
      .section-title { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: bold; fill: #333333; }
      .section-subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #666666; }
      .component-title { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; }
      .component-text { font-family: Arial, Helvetica, sans-serif; font-size: 10px; fill: #ffffff; }
      .principle-text { font-family: Arial, Helvetica, sans-serif; font-size: 10px; fill: #333333; }
      .arrow-label { font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: bold; fill: #333333; }
    </style>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#388E3C"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1976D2"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" class="title">OpenClaw Plugin Architecture</text>
  <text x="500" y="55" text-anchor="middle" class="subtitle">Two-Layer SDK + Runtime Extensibility Model</text>

  <!-- SDK Layer Box -->
  <rect x="30" y="80" width="440" height="260" rx="10" fill="#E8F5E9" stroke="#388E3C" stroke-width="3"/>
  <text x="250" y="105" text-anchor="middle" class="section-title">Plugin SDK</text>
  <text x="250" y="122" text-anchor="middle" class="section-subtitle">Compile-time, Stable, Publishable</text>

  <!-- SDK Components -->
  <rect x="50" y="140" width="125" height="85" rx="6" fill="#388E3C" stroke="#1B5E20" stroke-width="2"/>
  <text x="112" y="160" text-anchor="middle" class="component-title">Types</text>
  <text x="112" y="178" text-anchor="middle" class="component-text">ChannelPlugin</text>
  <text x="112" y="193" text-anchor="middle" class="component-text">ChannelMeta</text>
  <text x="112" y="208" text-anchor="middle" class="component-text">ChannelCapabilities</text>

  <rect x="185" y="140" width="135" height="85" rx="6" fill="#388E3C" stroke="#1B5E20" stroke-width="2"/>
  <text x="252" y="160" text-anchor="middle" class="component-title">Config Helpers</text>
  <text x="252" y="178" text-anchor="middle" class="component-text">buildConfigSchema</text>
  <text x="252" y="193" text-anchor="middle" class="component-text">setAccountEnabled</text>
  <text x="252" y="208" text-anchor="middle" class="component-text">applyAccountName</text>

  <rect x="330" y="140" width="125" height="85" rx="6" fill="#388E3C" stroke="#1B5E20" stroke-width="2"/>
  <text x="392" y="160" text-anchor="middle" class="component-title">Pairing Helpers</text>
  <text x="392" y="178" text-anchor="middle" class="component-text">formatPairingHint</text>
  <text x="392" y="193" text-anchor="middle" class="component-text">PAIRING_MESSAGE</text>

  <rect x="50" y="240" width="125" height="80" rx="6" fill="#388E3C" stroke="#1B5E20" stroke-width="2"/>
  <text x="112" y="260" text-anchor="middle" class="component-title">Onboarding</text>
  <text x="112" y="278" text-anchor="middle" class="component-text">promptAccessConfig</text>
  <text x="112" y="293" text-anchor="middle" class="component-text">addWildcardAllow</text>

  <rect x="185" y="240" width="135" height="80" rx="6" fill="#388E3C" stroke="#1B5E20" stroke-width="2"/>
  <text x="252" y="260" text-anchor="middle" class="component-title">Tool Params</text>
  <text x="252" y="278" text-anchor="middle" class="component-text">readStringParam</text>
  <text x="252" y="293" text-anchor="middle" class="component-text">readNumberParam</text>
  <text x="252" y="308" text-anchor="middle" class="component-text">jsonResult</text>

  <rect x="330" y="240" width="125" height="80" rx="6" fill="#388E3C" stroke="#1B5E20" stroke-width="2"/>
  <text x="392" y="260" text-anchor="middle" class="component-title">Utilities</text>
  <text x="392" y="278" text-anchor="middle" class="component-text">formatDocsLink</text>
  <text x="392" y="293" text-anchor="middle" class="component-text">Validation</text>

