<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <style type="text/css">
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: bold; fill: #333333; }
      .state-title { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: bold; fill: #ffffff; }
      .state-desc { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; }
      .transition-label { font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: bold; fill: #333333; }
      .section-label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: bold; fill: #333333; }
      .key-label { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: bold; fill: #666666; }
      .file-label { font-family: monospace; font-size: 10px; font-weight: bold; fill: #1976D2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
    <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999999"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" class="title">Session Lifecycle</text>

  <!-- Start point -->
  <circle cx="100" cy="150" r="20" fill="#333333"/>
  <text x="100" y="155" text-anchor="middle" style="font-family: Arial; font-size: 12px; font-weight: bold; fill: #ffffff;">Start</text>

  <!-- State: Created -->
  <rect x="180" y="110" width="140" height="80" rx="10" fill="#1976D2" stroke="#0D47A1" stroke-width="2" filter="url(#shadow)"/>
  <text x="250" y="140" text-anchor="middle" class="state-title">CREATED</text>
  <text x="250" y="160" text-anchor="middle" class="state-desc">New session</text>
  <text x="250" y="175" text-anchor="middle" class="state-desc">initialized</text>

  <!-- State: Active -->
  <rect x="380" y="110" width="140" height="80" rx="10" fill="#388E3C" stroke="#1B5E20" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="140" text-anchor="middle" class="state-title">ACTIVE</text>
  <text x="450" y="160" text-anchor="middle" class="state-desc">Processing</text>
  <text x="450" y="175" text-anchor="middle" class="state-desc">messages</text>

  <!-- State: Idle -->
  <rect x="580" y="110" width="140" height="80" rx="10" fill="#F57C00" stroke="#E65100" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="140" text-anchor="middle" class="state-title">IDLE</text>
  <text x="650" y="160" text-anchor="middle" class="state-desc">Waiting for</text>
  <text x="650" y="175" text-anchor="middle" class="state-desc">activity</text>

  <!-- State: Archived -->
  <rect x="780" y="110" width="100" height="80" rx="10" fill="#6B6B6B" stroke="#4D4D4D" stroke-width="2" filter="url(#shadow)"/>
  <text x="830" y="145" text-anchor="middle" class="state-title">ARCHIVED</text>
  <text x="830" y="165" text-anchor="middle" class="state-desc">Compacted</text>

  <!-- Transitions -->
  <!-- Start to Created -->
  <line x1="120" y1="150" x2="180" y2="150" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="150" y="140" text-anchor="middle" class="transition-label">new peer</text>

  <!-- Created to Active -->
  <line x1="320" y1="150" x2="380" y2="150" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="350" y="140" text-anchor="middle" class="transition-label">message</text>

  <!-- Active to Idle -->
  <line x1="520" y1="150" x2="580" y2="150" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="550" y="140" text-anchor="middle" class="transition-label">timeout</text>

  <!-- Idle to Archived -->
  <line x1="720" y1="150" x2="780" y2="150" stroke="#999999" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-dashed)"/>
  <text x="750" y="140" text-anchor="middle" class="transition-label">age limit</text>

  <!-- Idle back to Active -->
  <path d="M 650 190 L 650 220 L 450 220 L 450 190" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="550" y="235" text-anchor="middle" class="transition-label">new message</text>

  <!-- Active loop (self) -->
  <path d="M 450 110 C 450 60, 500 60, 500 110" fill="none" stroke="#388E3C" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="475" y="55" text-anchor="middle" class="transition-label">message</text>

  <!-- Session Key Format -->
  <rect x="50" y="280" width="350" height="130" rx="8" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="70" y="305" class="section-label">Session Key Format</text>
  <rect x="70" y="320" width="310" height="35" rx="6" fill="#ffffff" stroke="#90CAF9" stroke-width="1"/>
  <text x="225" y="343" text-anchor="middle" class="file-label">agent:&lt;agentId&gt;:&lt;peerId&gt;</text>
  <text x="70" y="380" class="key-label">Example:</text>
  <text x="130" y="380" class="file-label">agent:default:+1234567890</text>
  <text x="70" y="400" class="key-label">Example:</text>
  <text x="130" y="400" class="file-label">agent:coding-bot:@user#1234</text>

  <!-- File Storage -->
  <rect x="430" y="280" width="420" height="130" rx="8" fill="#FFF3E0" stroke="#F57C00" stroke-width="2"/>
  <text x="450" y="305" class="section-label">File Storage</text>
  <text x="450" y="330" class="key-label">Location:</text>
  <text x="510" y="330" class="file-label">~/.openclaw/agents/&lt;agentId&gt;/sessions/</text>

  <!-- Storage files -->
  <rect x="450" y="345" width="180" height="25" rx="4" fill="#ffffff" stroke="#FFB74D" stroke-width="1"/>
  <text x="540" y="362" text-anchor="middle" class="file-label">&lt;sessionKey&gt;.json</text>
  <text x="640" y="362" class="key-label">History</text>

  <rect x="450" y="375" width="180" height="25" rx="4" fill="#ffffff" stroke="#FFB74D" stroke-width="1"/>
  <text x="540" y="392" text-anchor="middle" class="file-label">&lt;sessionKey&gt;.meta</text>
  <text x="640" y="392" class="key-label">Metadata</text>

  <!-- Session Data Structure -->
  <rect x="50" y="430" width="800" height="150" rx="8" fill="#f5f5f5" stroke="#E0E0E0" stroke-width="2"/>
  <text x="70" y="455" class="section-label">Session Data Structure</text>

  <!-- JSON structure -->
  <rect x="70" y="470" width="350" height="95" rx="6" fill="#ffffff" stroke="#E0E0E0" stroke-width="1"/>
  <text x="85" y="490" font-family="monospace" font-size="10" font-weight="bold" fill="#1976D2">{</text>
  <text x="95" y="505" font-family="monospace" font-size="10" font-weight="bold" fill="#333">"messages": [</text>
  <text x="110" y="520" font-family="monospace" font-size="10" font-weight="bold" fill="#666">{"role": "user", "content": "..."},</text>
  <text x="110" y="535" font-family="monospace" font-size="10" font-weight="bold" fill="#666">{"role": "assistant", "content": "..."}</text>
  <text x="95" y="550" font-family="monospace" font-size="10" font-weight="bold" fill="#333">]</text>
  <text x="85" y="565" font-family="monospace" font-size="10" font-weight="bold" fill="#1976D2">}</text>

  <!-- Metadata structure -->
  <rect x="450" y="470" width="380" height="95" rx="6" fill="#ffffff" stroke="#E0E0E0" stroke-width="1"/>
  <text x="465" y="490" font-family="monospace" font-size="10" font-weight="bold" fill="#1976D2">{</text>
  <text x="475" y="505" font-family="monospace" font-size="10" font-weight="bold" fill="#333">"sessionKey": "agent:default:+123...",</text>
  <text x="475" y="520" font-family="monospace" font-size="10" font-weight="bold" fill="#333">"created": "2026-02-01T08:00:00Z",</text>
  <text x="475" y="535" font-family="monospace" font-size="10" font-weight="bold" fill="#333">"lastUpdated": "2026-02-05T10:00:00Z",</text>
  <text x="475" y="550" font-family="monospace" font-size="10" font-weight="bold" fill="#333">"messageCount": 42</text>
  <text x="465" y="565" font-family="monospace" font-size="10" font-weight="bold" fill="#1976D2">}</text>

  <!-- Labels -->
  <text x="245" y="460" class="key-label">History (.json)</text>
  <text x="640" y="460" class="key-label">Metadata (.meta)</text>
</svg>
