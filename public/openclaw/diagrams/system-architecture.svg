<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1100" height="650" viewBox="0 0 1100 650">
  <defs>
    <style type="text/css">
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: bold; fill: #333333; }
      .section-label { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: bold; fill: #333333; }
      .component-title { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
      .component-text { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #ffffff; }
      .port-label { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: bold; fill: #1976D2; }
      .legend-text { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #333333; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E65100"/>
    </marker>
    <marker id="arrowhead-pink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C2185B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="650" fill="#ffffff"/>

  <!-- Title -->
  <text x="550" y="35" text-anchor="middle" class="title">OpenClaw System Architecture</text>

  <!-- External Platforms Box -->
  <rect x="30" y="70" width="200" height="380" rx="10" fill="#f5f5f5" stroke="#666666" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="130" y="95" text-anchor="middle" class="section-label">External Platforms</text>

  <!-- WhatsApp -->
  <rect x="50" y="115" width="160" height="50" rx="8" fill="#60a917" stroke="#2D7600" stroke-width="2"/>
  <text x="130" y="135" text-anchor="middle" class="component-title">WhatsApp</text>
  <text x="130" y="152" text-anchor="middle" class="component-text">(Baileys)</text>

  <!-- Telegram -->
  <rect x="50" y="175" width="160" height="50" rx="8" fill="#0077B5" stroke="#005580" stroke-width="2"/>
  <text x="130" y="195" text-anchor="middle" class="component-title">Telegram</text>
  <text x="130" y="212" text-anchor="middle" class="component-text">(grammY)</text>

  <!-- Discord -->
  <rect x="50" y="235" width="160" height="50" rx="8" fill="#5865F2" stroke="#4752C4" stroke-width="2"/>
  <text x="130" y="255" text-anchor="middle" class="component-title">Discord</text>
  <text x="130" y="272" text-anchor="middle" class="component-text">(discord.js)</text>

  <!-- Slack -->
  <rect x="50" y="295" width="160" height="50" rx="8" fill="#E01E5A" stroke="#B01849" stroke-width="2"/>
  <text x="130" y="315" text-anchor="middle" class="component-title">Slack</text>
  <text x="130" y="332" text-anchor="middle" class="component-text">(Bolt)</text>

  <!-- Signal/iMessage -->
  <rect x="50" y="355" width="160" height="50" rx="8" fill="#6B6B6B" stroke="#4D4D4D" stroke-width="2"/>
  <text x="130" y="375" text-anchor="middle" class="component-title">Signal / iMessage</text>
  <text x="130" y="392" text-anchor="middle" class="component-text">(Native)</text>

  <!-- Docker Container Box -->
  <rect x="280" y="70" width="480" height="480" rx="10" fill="#e3f2fd" stroke="#1976D2" stroke-width="3"/>
  <text x="520" y="95" text-anchor="middle" class="section-label">Docker Container: openclaw-gateway</text>

  <!-- Gateway Server -->
  <rect x="310" y="115" width="180" height="80" rx="8" fill="#1976D2" stroke="#0D47A1" stroke-width="2"/>
  <text x="400" y="140" text-anchor="middle" class="component-title">Gateway Server</text>
  <text x="400" y="160" text-anchor="middle" class="component-text">WebSocket + HTTP</text>
  <text x="400" y="178" text-anchor="middle" class="component-text">Port 18789</text>

  <!-- Channel Connectors -->
  <rect x="310" y="215" width="180" height="60" rx="8" fill="#7B1FA2" stroke="#4A148C" stroke-width="2"/>
  <text x="400" y="240" text-anchor="middle" class="component-title">Channel Connectors</text>
  <text x="400" y="260" text-anchor="middle" class="component-text">Plugin Architecture</text>

  <!-- Message Router -->
  <rect x="310" y="295" width="180" height="60" rx="8" fill="#F57C00" stroke="#E65100" stroke-width="2"/>
  <text x="400" y="320" text-anchor="middle" class="component-title">Message Router</text>
  <text x="400" y="340" text-anchor="middle" class="component-text">Binding-based</text>

  <!-- Agent Runtime -->
  <rect x="310" y="375" width="180" height="80" rx="8" fill="#388E3C" stroke="#1B5E20" stroke-width="2"/>
  <text x="400" y="400" text-anchor="middle" class="component-title">Agent Runtime</text>
  <text x="400" y="420" text-anchor="middle" class="component-text">pi-agent-core</text>
  <text x="400" y="438" text-anchor="middle" class="component-text">Multi-Agent Support</text>

  <!-- Session Manager -->
  <rect x="520" y="215" width="100" height="60" rx="8" fill="#00897B" stroke="#004D40" stroke-width="2"/>
  <text x="570" y="240" text-anchor="middle" class="component-title">Session</text>
  <text x="570" y="258" text-anchor="middle" class="component-title">Manager</text>

  <!-- Control UI -->
  <rect x="520" y="115" width="100" height="60" rx="8" fill="#C2185B" stroke="#880E4F" stroke-width="2"/>
  <text x="570" y="140" text-anchor="middle" class="component-title">Control UI</text>
  <text x="570" y="158" text-anchor="middle" class="component-text">Web Dashboard</text>

  <!-- Canvas Host -->
  <rect x="640" y="115" width="100" height="70" rx="8" fill="#455A64" stroke="#263238" stroke-width="2"/>
  <text x="690" y="140" text-anchor="middle" class="component-title">Canvas</text>
  <text x="690" y="158" text-anchor="middle" class="component-title">Host</text>
  <text x="690" y="175" text-anchor="middle" class="component-text">18793</text>

  <!-- Browser Service -->
  <rect x="640" y="215" width="100" height="60" rx="8" fill="#455A64" stroke="#263238" stroke-width="2"/>
  <text x="690" y="240" text-anchor="middle" class="component-title">Browser</text>
  <text x="690" y="258" text-anchor="middle" class="component-title">Service</text>

  <!-- Tools & Skills -->
  <rect x="520" y="295" width="220" height="50" rx="8" fill="#455A64" stroke="#263238" stroke-width="2"/>
  <text x="630" y="317" text-anchor="middle" class="component-title">Tools &amp; Skills</text>
  <text x="630" y="335" text-anchor="middle" class="component-text">Extensible</text>

  <!-- LLM Providers Box -->
  <rect x="810" y="70" width="180" height="280" rx="10" fill="#fff3e0" stroke="#E65100" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="900" y="95" text-anchor="middle" class="section-label">LLM Providers</text>

  <!-- Google -->
  <rect x="830" y="115" width="140" height="45" rx="8" fill="#4285F4" stroke="#1A73E8" stroke-width="2"/>
  <text x="900" y="135" text-anchor="middle" class="component-title">Google</text>
  <text x="900" y="152" text-anchor="middle" class="component-text">Gemini</text>

  <!-- Anthropic -->
  <rect x="830" y="170" width="140" height="45" rx="8" fill="#D97757" stroke="#C45C3B" stroke-width="2"/>
  <text x="900" y="190" text-anchor="middle" class="component-title">Anthropic</text>
  <text x="900" y="207" text-anchor="middle" class="component-text">Claude</text>

  <!-- OpenAI -->
  <rect x="830" y="225" width="140" height="45" rx="8" fill="#10A37F" stroke="#0D8A6A" stroke-width="2"/>
  <text x="900" y="245" text-anchor="middle" class="component-title">OpenAI</text>
  <text x="900" y="262" text-anchor="middle" class="component-text">GPT</text>

  <!-- Ollama -->
  <rect x="830" y="280" width="140" height="45" rx="8" fill="#6B6B6B" stroke="#4D4D4D" stroke-width="2"/>
  <text x="900" y="300" text-anchor="middle" class="component-title">Local</text>
  <text x="900" y="317" text-anchor="middle" class="component-text">Ollama</text>

  <!-- Storage Box -->
  <rect x="810" y="380" width="180" height="170" rx="10" fill="#fce4ec" stroke="#C2185B" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="900" y="400" text-anchor="middle" class="section-label">Persistent Storage</text>
  <text x="900" y="418" text-anchor="middle" class="component-text" style="fill:#666666">~/.openclaw</text>

  <!-- Storage cylinders -->
  <ellipse cx="855" cy="445" rx="30" ry="10" fill="#FFCC80" stroke="#E65100" stroke-width="2"/>
  <rect x="825" y="445" width="60" height="40" fill="#FFCC80" stroke-width="0"/>
  <ellipse cx="855" cy="485" rx="30" ry="10" fill="#FFCC80" stroke="#E65100" stroke-width="2"/>
  <line x1="825" y1="445" x2="825" y2="485" stroke="#E65100" stroke-width="2"/>
  <line x1="885" y1="445" x2="885" y2="485" stroke="#E65100" stroke-width="2"/>
  <text x="855" y="470" text-anchor="middle" style="font-family: Arial; font-size: 10px; font-weight: bold; fill: #333;">Config</text>

  <ellipse cx="945" cy="445" rx="30" ry="10" fill="#FFCC80" stroke="#E65100" stroke-width="2"/>
  <rect x="915" y="445" width="60" height="40" fill="#FFCC80" stroke-width="0"/>
  <ellipse cx="945" cy="485" rx="30" ry="10" fill="#FFCC80" stroke="#E65100" stroke-width="2"/>
  <line x1="915" y1="445" x2="915" y2="485" stroke="#E65100" stroke-width="2"/>
  <line x1="975" y1="445" x2="975" y2="485" stroke="#E65100" stroke-width="2"/>
  <text x="945" y="470" text-anchor="middle" style="font-family: Arial; font-size: 10px; font-weight: bold; fill: #333;">Sessions</text>

  <ellipse cx="900" cy="510" rx="30" ry="10" fill="#FFCC80" stroke="#E65100" stroke-width="2"/>
  <rect x="870" y="510" width="60" height="30" fill="#FFCC80" stroke-width="0"/>
  <ellipse cx="900" cy="540" rx="30" ry="10" fill="#FFCC80" stroke="#E65100" stroke-width="2"/>
  <line x1="870" y1="510" x2="870" y2="540" stroke="#E65100" stroke-width="2"/>
  <line x1="930" y1="510" x2="930" y2="540" stroke="#E65100" stroke-width="2"/>
  <text x="900" y="530" text-anchor="middle" style="font-family: Arial; font-size: 10px; font-weight: bold; fill: #333;">Workspace</text>

  <!-- Arrows - External to Connectors -->
  <path d="M 210 140 L 260 245 L 310 245" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 210 200 L 260 245 L 310 245" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 210 260 L 310 245" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 210 320 L 260 245 L 310 245" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Internal arrows -->
  <line x1="400" y1="195" x2="400" y2="215" stroke="#1976D2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="275" x2="400" y2="295" stroke="#1976D2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="355" x2="400" y2="375" stroke="#1976D2" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Agent to LLM -->
  <path d="M 490 415 L 770 415 L 770 140 L 830 140" fill="none" stroke="#E65100" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-orange)"/>

  <!-- Agent to Storage -->
  <path d="M 490 415 L 770 415 L 770 475 L 825 475" fill="none" stroke="#C2185B" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-pink)"/>

  <!-- Port Label -->
  <rect x="495" y="130" width="50" height="20" rx="4" fill="#E3F2FD"/>
  <text x="520" y="144" text-anchor="middle" class="port-label">:18789</text>

  <!-- Legend -->
  <rect x="30" y="480" width="200" height="80" rx="8" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <text x="45" y="500" class="section-label">Legend</text>
  <line x1="45" y1="520" x2="75" y2="520" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="85" y="525" class="legend-text">Data Flow</text>
  <line x1="45" y1="545" x2="75" y2="545" stroke="#E65100" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-orange)"/>
  <text x="85" y="550" class="legend-text">API Call</text>

</svg>
